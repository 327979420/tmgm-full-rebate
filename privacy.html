<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy Notice</title><style>:root{--navy:#061a44;--cyan:#16b8d7;--bg:#f5f8fc;--text:#14213d;--muted:#667085;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}.top{background:var(--navy);color:#fff}.nav,.wrap{width:min(900px,92%);margin:auto}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:22px}.controls{display:flex;gap:10px}.controls select,.back{border:0;border-radius:9px;padding:10px 14px}.back{background:var(--cyan);color:#fff;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#041333,#0b3f91);color:#fff;padding:52px 0}.hero h1{font-size:clamp(34px,6vw,54px);margin:0}.content{padding:44px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}.card h2{margin-top:28px}.card h2:first-child{margin-top:0}.card p{color:var(--muted)}.footer{background:#020b1e;color:#b8c5dc;padding:26px 0;font-size:13px}@media(max-width:600px){.nav{padding:14px 0;align-items:flex-start;flex-direction:column}.controls{width:100%}.controls select,.back{flex:1}}</style></head><body><header class="top"><div class="nav"><div id="brand" class="brand"></div><div class="controls"><select id="lang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option><option value="th">ไทย</option></select><a id="back" class="back" href="index.html"></a></div></div></header><section class="hero"><div class="wrap"><h1 id="title"></h1></div></section><main class="content"><div class="wrap"><article id="body" class="card"></article></div></main><footer class="footer"><div class="wrap">freddy.liang@tmgm.com</div></footer><script>
const D={
'zh-CN':{brand:'满返网',back:'返回网站',title:'隐私说明',html:`<h2>我们收集什么</h2><p>申请表可能收集申请平台、姓名、国家或地区、联系方式、平台注册邮箱、MT4/MT5交易账号、账户状态、行业经验、客户来源及你主动填写的说明。</p><h2>使用目的</h2><p>资料仅用于联系申请人、核对满返或Introducing Broker申请、跟进处理结果及防止重复提交。</p><h2>表单传输</h2><p>表单通过FormSubmit邮件转发服务发送至 freddy.liang@tmgm.com。提交即表示你理解资料会经过该第三方服务传输。网站同时会在当前设备保存最近一次申请编号和表单副本，作为提交失败时的备用记录。</p><h2>不要提交的资料</h2><p>请勿提交交易密码、投资者密码、验证码、银行卡资料、证件图片或其他不必要的敏感信息。</p><h2>保留与删除</h2><p>申请资料只保留至完成审核、服务跟进及必要记录保存。需要查询、更正或删除资料，可通过工作邮箱或Telegram联系。</p><h2>网站身份</h2><p>满返网是独立多平台返佣服务页面，并非任何交易平台的官方网站，也不提供个人投资建议。</p>`},
'zh-TW':{brand:'滿返網',back:'返回網站',title:'私隱說明',html:`<h2>我們收集甚麼</h2><p>申請表可能收集申請平台、姓名、國家或地區、聯絡方式、平台註冊電郵、MT4/MT5交易帳號、帳戶狀態、行業經驗、客戶來源及你主動填寫的說明。</p><h2>使用目的</h2><p>資料只用於聯絡申請人、核對滿返或Introducing Broker申請、跟進處理結果及防止重複提交。</p><h2>表單傳輸</h2><p>表單透過FormSubmit電郵轉發服務發送至 freddy.liang@tmgm.com。提交即表示你理解資料會經過該第三方服務傳輸。網站亦會在目前裝置保存最近一次申請編號及表單副本，作為提交失敗時的備用記錄。</p><h2>不要提交的資料</h2><p>請勿提交交易密碼、投資者密碼、驗證碼、銀行卡資料、證件圖片或其他不必要的敏感資料。</p><h2>保留與刪除</h2><p>申請資料只保留至完成審核、服務跟進及必要記錄保存。需要查詢、更正或刪除資料，可透過工作電郵或Telegram聯絡。</p><h2>網站身份</h2><p>滿返網是獨立多平台返佣服務頁面，並非任何交易平台的官方網站，也不提供個人投資建議。</p>`},
en:{brand:'Rebate Hub',back:'Back to website',title:'Privacy notice',html:`<h2>Information collected</h2><p>Application forms may collect the selected platform, name, country or region, contact details, platform-registered email, MT4/MT5 account number, account status, industry experience, client sources and information you voluntarily provide.</p><h2>Purpose</h2><p>The information is used only to contact applicants, review rebate or Introducing Broker applications, follow up outcomes and prevent duplicate submissions.</p><h2>Form transmission</h2><p>Forms are forwarded to freddy.liang@tmgm.com through the FormSubmit email service. By submitting, you acknowledge that the data is transmitted through this third-party service. The website also stores the latest reference and a local form copy on the current device as a fallback.</p><h2>Do not submit</h2><p>Never submit trading or investor passwords, verification codes, card details, identity-document images or unnecessary sensitive information.</p><h2>Retention and requests</h2><p>Application data is retained only for review, service follow-up and necessary records. Contact the work email or Telegram to request access, correction or deletion.</p><h2>Site identity</h2><p>Rebate Hub is an independent multi-platform rebate service, not the official website of any trading platform, and it does not provide personal financial advice.</p>`},
ms:{brand:'Hab Rebat',back:'Kembali ke laman',title:'Notis privasi',html:`<h2>Maklumat yang dikumpul</h2><p>Borang boleh mengumpul platform yang dipilih, nama, negara atau wilayah, butiran hubungan, e-mel berdaftar platform, nombor akaun MT4/MT5, status akaun, pengalaman industri, sumber pelanggan dan maklumat yang anda berikan.</p><h2>Tujuan</h2><p>Maklumat digunakan untuk menghubungi pemohon, menyemak rebat atau permohonan Introducing Broker, membuat susulan dan mencegah penghantaran berganda.</p><h2>Penghantaran borang</h2><p>Borang dihantar ke freddy.liang@tmgm.com melalui perkhidmatan e-mel FormSubmit. Dengan menghantar, anda memahami data melalui perkhidmatan pihak ketiga ini. Laman juga menyimpan rujukan terakhir dan salinan tempatan pada peranti semasa sebagai sandaran.</p><h2>Jangan hantar</h2><p>Jangan hantar kata laluan dagangan atau pelabur, kod pengesahan, butiran kad, imej dokumen identiti atau maklumat sensitif yang tidak diperlukan.</p><h2>Penyimpanan dan permintaan</h2><p>Data disimpan hanya untuk semakan, susulan perkhidmatan dan rekod yang perlu. Hubungi e-mel kerja atau Telegram untuk akses, pembetulan atau pemadaman.</p><h2>Identiti laman</h2><p>Hab Rebat ialah perkhidmatan rebat berbilang platform bebas, bukan laman rasmi mana-mana platform dagangan, dan tidak memberikan nasihat kewangan peribadi.</p>`},
'th':{brand:'ศูนย์รีเบต',back:'กลับเว็บไซต์',title:'ประกาศความเป็นส่วนตัว',html:`<h2>ข้อมูลที่เก็บ</h2><p>แบบฟอร์มอาจเก็บแพลตฟอร์มที่เลือก ชื่อ ประเทศหรือภูมิภาค ช่องทางติดต่อ อีเมลที่ลงทะเบียนกับแพลตฟอร์ม หมายเลขบัญชี MT4/MT5 สถานะบัญชี ประสบการณ์ แหล่งลูกค้า และข้อมูลที่คุณสมัครใจให้</p><h2>วัตถุประสงค์</h2><p>ใช้ข้อมูลเพื่อติดต่อผู้สมัคร ตรวจสอบรีเบตหรือใบสมัคร Introducing Broker ติดตามผล และป้องกันการส่งซ้ำ</p><h2>การส่งแบบฟอร์ม</h2><p>แบบฟอร์มถูกส่งไปที่ freddy.liang@tmgm.com ผ่านบริการอีเมล FormSubmit การส่งแบบฟอร์มหมายความว่าคุณเข้าใจว่าข้อมูลจะผ่านบริการบุคคลที่สามนี้ เว็บไซต์ยังเก็บหมายเลขอ้างอิงล่าสุดและสำเนาแบบฟอร์มไว้ในอุปกรณ์ปัจจุบันเป็นข้อมูลสำรอง</p><h2>ห้ามส่ง</h2><p>ห้ามส่งรหัสผ่านเทรดหรือรหัสผ่านนักลงทุน รหัสยืนยัน ข้อมูลบัตร ภาพเอกสารยืนยันตัวตน หรือข้อมูลอ่อนไหวที่ไม่จำเป็น</p><h2>การเก็บรักษาและคำขอ</h2><p>ข้อมูลจะเก็บไว้เท่าที่จำเป็นสำหรับการตรวจสอบ การติดตามบริการ และบันทึกที่จำเป็น ติดต่ออีเมลที่ทำงานหรือ Telegram เพื่อขอเข้าถึง แก้ไข หรือลบข้อมูล</p><h2>สถานะเว็บไซต์</h2><p>ศูนย์รีเบตเป็นบริการรีเบตหลายแพลตฟอร์มแบบอิสระ ไม่ใช่เว็บไซต์ทางการของแพลตฟอร์มเทรดใด ๆ และไม่ได้ให้คำแนะนำทางการเงินส่วนบุคคล</p>`}}
function setLang(l){if(!D[l])l='en';localStorage.setItem('tmgm-lang',l);document.documentElement.lang=l;document.getElementById('lang').value=l;const d=D[l];document.getElementById('brand').textContent=d.brand;document.getElementById('back').textContent=d.back;document.getElementById('title').textContent=d.title;document.getElementById('body').innerHTML=d.html}document.getElementById('lang').addEventListener('change',e=>setLang(e.target.value));const s=localStorage.getItem('tmgm-lang'),b=(navigator.language||'en').toLowerCase();setLang(s||(b.startsWith('zh-tw')||b.startsWith('zh-hk')?'zh-TW':b.startsWith('zh')?'zh-CN':b.startsWith('ms')?'ms':b.startsWith('th')?'th':'en'));
</script></body></html>
