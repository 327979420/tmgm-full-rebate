<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="满返网 Max Rebate 隐私政策：说明返佣与IB申请资料的收集、使用、第三方传输、本地存储、安全、访问、更正与删除方式。"><meta name="robots" content="index,follow"><link rel="canonical" href="https://max-rebate.com/privacy.html"><title>Privacy Policy｜满返网隐私政策</title><link rel="stylesheet" href="assets/trust.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html" id="brand">满返网</a><div class="controls"><select id="lang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option><option value="th">ไทย</option></select><a class="back" id="back" href="index.html">返回网站</a></div></div></header><section class="hero"><div class="wrap"><span class="eyebrow">MAX REBATE</span><h1 id="title">隐私政策</h1><p id="intro"></p></div></section><main class="content"><div class="wrap"><article class="card" id="body"></article></div></main><footer class="footer"><div class="wrap"><strong>© 2026 Max Rebate · 满返网</strong><div class="footer-links"><a href="about.html">About Us</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a><a href="risk-disclaimer.html">Risk Disclaimer</a><a href="contact.html">Contact</a></div><p class="risk">CFD及其他杠杆产品具有高风险。本网站不提供个人投资建议。</p></div></footer><script>

'zh-CN':{brand:'满返网',back:'返回网站',title:'隐私政策',intro:'我们只希望收集处理返佣或合作申请真正需要的信息。',html:`<h2>1. 关于本政策</h2><p>本政策说明满返网（Max Rebate）当前如何处理通过本网站提交的个人信息。满返网是独立返佣及合作信息服务平台，并非TMGM或其他交易平台的官方网站。</p><h2>2. 我们可能收集的信息</h2><p>根据你使用的申请表或联系渠道，我们可能收集：申请平台、平台注册邮箱、账户注册时间或状态、返佣或Introducing Broker申请类型、申请编号、联系方式，以及你主动提供的其他说明。</p><div class="callout warning"><strong>我们不会要求：</strong>交易密码、投资者密码、验证码、银行卡密码、完整银行卡资料、证件图片或其他与申请无关的敏感资料。请不要主动发送这些信息。</div><h2>3. 为什么收集</h2><ul><li>接收和处理返佣或Introducing Broker申请；</li><li>联系申请人并核实申请记录；</li><li>跟进账户关系、资格或处理结果；</li><li>识别重复、错误或异常提交；</li><li>处理访问、更正或删除资料的请求。</li></ul><h2>4. 表单如何传输</h2><p>网站目前使用FormSubmit作为表单转发服务，将申请资料发送至指定服务邮箱。因此，你提交的数据会经过该第三方服务的基础设施进行传输和处理。第三方服务的基础设施和处理地点可能发生变化。</p><h2>5. 浏览器本地存储</h2><p>为提供提交失败时的备用记录，网站会在你当前设备的浏览器Local Storage中保存最近的申请编号、申请类型和表单副本等信息，也会保存语言偏好。此类本地记录保存在该浏览器/设备中，并不等同于一个跨设备客户账户。</p><h2>6. 向平台或服务方披露</h2><p>在处理申请确有必要时，相关资料可能被用于与对应交易平台、经纪商或服务合作方核实账户关系、返佣资格或申请状态。我们不会把资料用于与申请无关的出售或数据交易。</p><h2>7. 信息保留</h2><p>我们只在处理申请、服务跟进、记录核对以及合理业务或法律需要的期限内保留相关资料。浏览器本地记录可由用户清除浏览器网站数据删除。服务端或邮箱记录如不再合理需要，会按实际运营需要进行删除或去标识化处理。</p><h2>8. 数据安全</h2><p>我们会采取与网站规模和资料性质相匹配的合理措施保护申请信息，但任何互联网传输、电子邮件或第三方服务都无法保证绝对安全。</p><h2>9. 查询、更正或删除</h2><p>你可以要求查询、更正或删除曾提交的资料。请通过<a href="contact.html">Contact页面</a>的任一渠道联系，并注明“Privacy Request / 隐私请求”。为了避免他人冒领或删除记录，我们可能需要核对足够的信息以确认你与相关申请记录相匹配。</p><h2>10. Cookies与分析工具</h2><p>当前主要功能依赖浏览器Local Storage，而不是用于广告画像的Cookie。如果未来加入分析、广告像素、CRM或客户登录系统，本政策会相应更新。</p><h2>11. 政策更新</h2><p>当表单、数据存储方式、第三方服务或客户账户功能发生变化时，我们会更新本政策并修改页面日期。</p><div class="trust-nav"><a href="about.html">关于我们</a><a href="terms.html">使用条款</a><a href="risk-disclaimer.html">风险声明</a><a href="contact.html">联系我们</a></div><p class="meta">Last updated: 10 August 2026</p>`},
'zh-TW':{brand:'滿返網',back:'返回網站',title:'私隱政策',intro:'我們只希望收集處理返佣或合作申請真正需要的資料。',html:`<h2>我們可能收集的資料</h2><p>視乎你使用的表格或聯絡渠道，我們可能收集申請平台、註冊電郵、帳戶狀態、申請類型、申請編號、聯絡方式及你主動提供的說明。</p><div class="callout warning"><strong>我們不會要求：</strong>交易密碼、驗證碼、銀行卡密碼或證件圖片。</div><h2>用途</h2><p>資料用於處理返佣或Introducing Broker申請、聯絡申請人、核對記錄及跟進結果。</p><h2>第三方傳輸</h2><p>網站目前透過FormSubmit把表格轉發至指定服務郵箱，因此資料會經過第三方服務基礎設施。</p><h2>本機儲存</h2><p>瀏覽器Local Storage會保存最近的申請編號、表格備份和語言偏好。這不是跨裝置客戶帳戶。</p><h2>查詢、更正及刪除</h2><p>請透過<a href="contact.html">Contact頁面</a>提出Privacy Request。我們可能需要核對資料，以確認你與相關記錄相匹配。</p><div class="trust-nav"><a href="about.html">關於我們</a><a href="terms.html">使用條款</a><a href="risk-disclaimer.html">風險聲明</a><a href="contact.html">聯絡我們</a></div><p class="meta">Last updated: 10 August 2026</p>`},
en:{brand:'Max Rebate',back:'Back to website',title:'Privacy Policy',intro:'We aim to collect only the information genuinely needed to process rebate or partnership applications.',html:`<h2>1. About this policy</h2><p>This policy describes how Max Rebate currently handles personal information submitted through this website. Max Rebate is an independent rebate and partnership information service and is not the official website of TMGM or another trading platform.</p><h2>2. Information we may collect</h2><p>Depending on the application form or contact method, we may collect the selected platform, platform-registered email, account registration timing or status, rebate or Introducing Broker application type, application reference, contact details and other information you voluntarily provide.</p><div class="callout warning"><strong>We do not request:</strong> trading or investor passwords, verification codes, bank-card passwords, full card details, identity-document images or unrelated sensitive information. Please do not send them.</div><h2>3. Why we collect it</h2><ul><li>Receive and process rebate or Introducing Broker applications.</li><li>Contact applicants and identify application records.</li><li>Follow up account relationships, eligibility or outcomes.</li><li>Identify duplicate, erroneous or abnormal submissions.</li><li>Handle access, correction or deletion requests.</li></ul><h2>4. Form transmission</h2><p>The site currently uses FormSubmit to forward application data to a designated service inbox. Submitted data therefore passes through that third-party service's infrastructure for transmission and processing. The provider's infrastructure and processing locations may change.</p><h2>5. Browser local storage</h2><p>As a fallback when submission fails, the site stores recent application references, application type and a local form copy in Local Storage on the current browser/device. It also stores language preferences. These local records are not a cross-device customer account.</p><h2>6. Disclosure for application processing</h2><p>Where reasonably necessary to process an application, relevant information may be used with the relevant trading platform, broker or service partner to verify account relationships, rebate eligibility or application status. We do not sell application data for unrelated data trading.</p><h2>7. Retention</h2><p>Information is kept only as reasonably needed for application processing, service follow-up, record verification and legitimate business or legal needs. Browser-local records can be removed by clearing site data. Server or mailbox records that are no longer reasonably needed may be deleted or de-identified as part of normal operations.</p><h2>8. Security</h2><p>We take reasonable measures appropriate to the scale of the site and the nature of the information, but no internet transmission, email system or third-party service can be guaranteed absolutely secure.</p><h2>9. Access, correction or deletion</h2><p>To request access, correction or deletion of information previously submitted, contact us through the <a href="contact.html">Contact page</a> and state “Privacy Request”. We may need sufficient information to match you to the relevant application record and protect it from unauthorised access or deletion.</p><h2>10. Cookies and analytics</h2><p>Core site functionality currently relies mainly on browser Local Storage rather than advertising-profile cookies. If analytics, advertising pixels, CRM systems or customer login features are introduced, this policy will be updated.</p><h2>11. Updates</h2><p>We will update this policy when forms, storage, third-party services or customer account functionality materially change.</p><div class="trust-nav"><a href="about.html">About Us</a><a href="terms.html">Terms of Use</a><a href="risk-disclaimer.html">Risk Disclaimer</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`},
ms:{brand:'Max Rebate',back:'Kembali',title:'Polisi Privasi',intro:'Kami hanya mahu mengumpul maklumat yang benar-benar diperlukan untuk memproses permohonan.',html:`<h2>Maklumat</h2><p>Kami mungkin mengumpul platform, e-mel berdaftar, status akaun, jenis permohonan, rujukan dan maklumat yang anda berikan.</p><div class="callout warning"><strong>Kami tidak meminta:</strong> kata laluan dagangan, kod pengesahan, kata laluan kad atau imej dokumen identiti.</div><h2>Penghantaran</h2><p>Borang kini dihantar melalui FormSubmit ke peti masuk perkhidmatan. Salinan sandaran dan rujukan terkini juga boleh disimpan dalam Local Storage pada peranti anda.</p><h2>Permintaan privasi</h2><p>Hubungi melalui <a href="contact.html">halaman Contact</a> untuk akses, pembetulan atau pemadaman.</p><div class="trust-nav"><a href="about.html">About</a><a href="terms.html">Terms</a><a href="risk-disclaimer.html">Risk</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`},
'th':{brand:'Max Rebate',back:'กลับเว็บไซต์',title:'นโยบายความเป็นส่วนตัว',intro:'เราเก็บเฉพาะข้อมูลที่จำเป็นต่อการดำเนินการสมัครเท่านั้น',html:`<h2>ข้อมูลที่อาจเก็บ</h2><p>เราอาจเก็บแพลตฟอร์ม อีเมลที่ลงทะเบียน สถานะบัญชี ประเภทใบสมัคร หมายเลขอ้างอิง และข้อมูลที่คุณสมัครใจให้</p><div class="callout warning"><strong>เราไม่ขอ:</strong> รหัสผ่านเทรด รหัสยืนยัน รหัสผ่านบัตร หรือภาพเอกสารยืนยันตัวตน</div><h2>การส่งข้อมูล</h2><p>ปัจจุบันแบบฟอร์มส่งผ่าน FormSubmit ไปยังกล่องรับบริการ และอาจเก็บสำเนาสำรองกับหมายเลขอ้างอิงล่าสุดใน Local Storage ของอุปกรณ์</p><h2>คำขอด้านความเป็นส่วนตัว</h2><p>ติดต่อผ่าน <a href="contact.html">หน้า Contact</a> เพื่อขอเข้าถึง แก้ไข หรือลบข้อมูล</p><div class="trust-nav"><a href="about.html">About</a><a href="terms.html">Terms</a><a href="risk-disclaimer.html">Risk</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`}}
function setLang(l){if(!D[l])l='en';localStorage.setItem('tmgm-lang',l);document.documentElement.lang=l;document.getElementById('lang').value=l;const d=D[l];brand.textContent=d.brand;back.textContent=d.back;title.textContent=d.title;intro.textContent=d.intro;body.innerHTML=d.html}document.getElementById('lang').addEventListener('change',e=>setLang(e.target.value));const s=localStorage.getItem('tmgm-lang'),b=(navigator.language||'en').toLowerCase();setLang(s||(b.startsWith('zh-tw')||b.startsWith('zh-hk')?'zh-TW':b.startsWith('zh')?'zh-CN':b.startsWith('ms')?'ms':b.startsWith('th')?'th':'en'));
</script></body></html>
