nd approximate opening date.',t4t:'Apply as an Introducing Broker',t4d:'Describe client channels and experience, then confirm the agreement after approval.',formsTitle:'Submit an application',formsDesc:'Forms are currently enabled for TMGM only. Other platforms will be enabled in the selector after launch. Submissions are forwarded to the service email and assigned a reference number.',rebateForm:'Rebate application',ibForm:'Introducing Broker application',platform:'Application platform',registeredEmailQ:'Question 1: Registered email for the platform account',registeredWithinQ:'Question 2: Was the account registered within the last 3 days?',emailReachableQ:'Question 3: Can we contact you through the registered email?',pleaseSelect:'Please select',yesOption:'Yes',noOption:'No',contactInstruction:'If you select “No”, add a staff member through the WeChat, QQ, Discord or Telegram options provided on this website so the rebate permission can be activated smoothly.',ecSoon:'EC Markets — Coming soon',icSoon:'IC Markets — Coming soon',exSoon:'Exness — Coming soon',name:'Name',nameTeam:'Name or team name',country:'Country or region',contact:'WeChat, QQ, Discord, Telegram or phone',email:'Platform registered email',account:'MT4/MT5 trading account',accountStatus:'Account status',newAccount:'New account registered within three days',oldAccount:'Account registered more than three days ago',notOpened:'Not opened yet',notes:'Additional information',experience:'Industry experience and client resources',channels:'Client sources, community or promotion channels',consent:'I consent to the use of this information to contact me and process the application.',submit:'Submit application',submitting:'Submitting…',success:'Submitted. Reference: ',submitError:'Online submission was not completed. A local copy was saved. Contact through Telegram or Discord and provide reference: ',faqTitle:'Frequently asked questions',faqDesc:'Specific rules vary by platform. The answers below primarily describe the currently live TMGM setup.',faq1q:'What is an Introducing Broker?',faq1a:'In simple terms, an Introducing Broker brings clients to a trading platform. The IB uses a community, content, referrals or an existing client network to help interested traders open accounts and receive ongoing support, then earns commission based on eligible client trading volume. It is best suited to people who already have trader relationships, audience reach or offline acquisition channels and are prepared to support those clients.',faq2q:'How are rebates received and withdrawn?',faq2a:'Under the current TMGM setup, one MT4 or MT5 trading account is designated as the rebate receiving account. Eligible rebates generated by linked clients are generally credited on the next processing day. Once credited, funds may be withdrawn through the channels supported by the platform. Amounts, timing and withdrawal methods remain subject to account review and platform rules; future platforms may use different processes.',faq3q:'Does “full rebate” mean every trade is unconditionally refunded?',faq3a:'No. Eligibility, amount and applicable products depend on platform policy, account group, valid trading records and approval.',faq4q:'Can an existing account apply?',faq4a:'A review may be requested, but transfers, attribution changes or rebate activation require manual confirmation under the platform rules.',faq5q:'Does the site collect passwords or identity documents?',faq5a:'No. Never submit trading or investor passwords, verification codes, card details or identity-document images.',faq6q:'Which regions are currently not supported for account opening or Introducing Broker applications?',faq6a:'The current restricted list includes Afghanistan, Japan, North Korea, the U.S. Virgin Islands, the United States Minor Outlying Islands, the United States, Iran, Russia, Somalia, the Democratic Republic of the Congo, the Central African Republic, Guinea-Bissau, Crimea, Lebanon, Sudan, Libya, Zimbabwe, Yemen, Mali, Venezuela, Cuba, Belarus, Syria, South Sudan, Myanmar, Ukraine, Singapore and Romania. In practice, applicants outside this list can usually submit an account-opening or Introducing Broker application, but final approval remains subject to platform compliance review, identity verification and local requirements.',contactTitle:'Contact and communities',contactDesc:'WeChat and QQ are shown only as QR codes. You can also use Discord or Telegram.',scan:'Scan or click to open',discordText:'Join the community for service updates.',join:'Join Discord',emailBtn:'Send email',telegramBtn:'Open Telegram',footerIdentity:'Rebate Hub is an independent multi-platform rebate service and is not the official website of any trading platform. Platform names and marks are shown only to identify the relevant product.',privacy:'Privacy notice',risk:'CFDs are high-risk leveraged products and may cause rapid losses. This site does not provide personal financial advice.'},

anggan dan pengalaman, kemudian sahkan perjanjian selepas kelulusan.',formsTitle:'Hantar permohonan',formsDesc:'Borang kini diaktifkan untuk TMGM sahaja. Platform lain akan diaktifkan dalam pilihan selepas pelancaran. Permohonan dihantar ke e-mel perkhidmatan dan diberi nombor rujukan.',rebateForm:'Permohonan rebat',ibForm:'Permohonan Introducing Broker',platform:'Platform permohonan',registeredEmailQ:'Soalan 1: E-mel berdaftar untuk akaun platform',registeredWithinQ:'Soalan 2: Adakah akaun didaftarkan dalam tempoh 3 hari?',emailReachableQ:'Soalan 3: Bolehkah kami menghubungi anda melalui e-mel berdaftar?',pleaseSelect:'Sila pilih',yesOption:'Ya',noOption:'Tidak',contactInstruction:'Jika anda memilih “Tidak”, tambah kakitangan melalui WeChat, QQ, Discord atau Telegram yang disediakan di laman ini supaya kebenaran rebat dapat diaktifkan dengan lancar.',ecSoon:'EC Markets — Akan datang',icSoon:'IC Markets — Akan datang',exSoon:'Exness — Akan datang',name:'Nama',nameTeam:'Nama atau nama pasukan',country:'Negara atau wilayah',contact:'WeChat, QQ, Discord, Telegram atau telefon',email:'E-mel berdaftar platform',account:'Akaun dagangan MT4/MT5',accountStatus:'Status akaun',newAccount:'Akaun baharu dalam tiga hari',oldAccount:'Akaun lebih tiga hari',notOpened:'Belum dibuka',notes:'Maklumat tambahan',experience:'Pengalaman industri dan sumber pelanggan',channels:'Sumber pelanggan, komuniti atau saluran promosi',consent:'Saya bersetuju maklumat ini digunakan untuk menghubungi saya dan memproses permohonan.',submit:'Hantar permohonan',submitting:'Menghantar…',success:'Berjaya dihantar. Rujukan: ',submitError:'Penghantaran dalam talian tidak selesai. Salinan tempatan disimpan. Hubungi melalui Telegram atau Discord dan berikan rujukan: ',faqTitle:'Soalan lazim',faqDesc:'Peraturan khusus berbeza mengikut platform. Jawapan berikut terutamanya menerangkan pelan TMGM yang kini tersedia.',faq1q:'Apakah Introducing Broker?',faq1a:'Secara ringkas, Introducing Broker memperkenalkan pelanggan kepada platform dagangan. IB menggunakan komuniti, kandungan, rujukan atau rangkaian pelanggan sedia ada untuk membantu pedagang membuka akaun dan menerima sokongan, kemudian memperoleh komisen berdasarkan volum dagangan pelanggan yang layak. Ia sesuai untuk individu yang sudah mempunyai sumber pelanggan, audiens atau saluran luar talian dan bersedia menyokong pelanggan tersebut.',faq2q:'Bagaimanakah rebat diterima dan dikeluarkan?',faq2a:'Di bawah pelan TMGM semasa, satu akaun dagangan MT4 atau MT5 ditetapkan sebagai akaun penerima rebat. Rebat layak daripada pelanggan yang dipautkan biasanya dikreditkan pada hari pemprosesan berikutnya. Selepas dikreditkan, dana boleh dikeluarkan melalui saluran yang disokong platform. Amaun, masa dan kaedah pengeluaran tertakluk pada semakan akaun dan peraturan platform; platform lain mungkin menggunakan proses berbeza.',faq3q:'Adakah “rebat penuh” bermaksud setiap dagangan dibayar balik tanpa syarat?',faq3a:'Tidak. Kelayakan, amaun dan produk bergantung pada polisi platform, kumpulan akaun, rekod dagangan sah dan kelulusan.',faq4q:'Bolehkah akaun sedia ada memohon?',faq4a:'Semakan boleh diminta, tetapi pemindahan, perubahan pemilikan atau pengaktifan rebat memerlukan pengesahan manual.',faq5q:'Adakah laman mengumpul kata laluan atau dokumen identiti?',faq5a:'Tidak. Jangan hantar kata laluan dagangan atau pelabur, kod pengesahan, butiran kad atau imej dokumen identiti.',faq6q:'Wilayah manakah yang kini tidak disokong untuk pembukaan akaun atau permohonan Introducing Broker?',faq6a:'Senarai sekatan semasa merangkumi Afghanistan, Jepun, Korea Utara, Kepulauan Virgin A.S., Kepulauan Terpencil Kecil A.S., Amerika Syarikat, Iran, Rusia, Somalia, Republik Demokratik Congo, Republik Afrika Tengah, Guinea-Bissau, Crimea, Lubnan, Sudan, Libya, Zimbabwe, Yaman, Mali, Venezuela, Cuba, Belarus, Syria, Sudan Selatan, Myanmar, Ukraine, Singapura dan Romania. Secara amnya, pemohon di luar senarai ini biasanya boleh menghantar permohonan function renderTable(lang){const p=P[lang]||P.en;let h='<thead><tr>'+p.heads.map((x,i)=>{const parts=x.split('｜');return `<th class="${i===5?'raw':''}">${parts[0]}${parts[1]?`<br><small>${parts[1]}</small>`:''}</th>`}).join('')+'</tr></thead><tbody>';h+=p.rows.map(r=>'<tr>'+r.map((x,i)=>{const tag=i?'td':'th',cl=i===5?' class="raw"':'';const parts=x.split('｜');return `<${tag}${cl}><span class="cell-main">${parts[0]}</span>${parts.slice(1).map(v=>`<span class="cell-sub">${v}</span>`).join('')}</${tag}>`}).join('')+'</tr>').join('')+'</tbody>';document.getElementById('policyTable').innerHTML=h}

const emailReachableSelect=document.getElementById('emailReachable');const contactInstruction=document.getElementById('contactInstruction');function toggleContactInstruction(){if(!emailReachableSelect||!contactInstruction)return;contactInstruction.hidden=emailReachableSelect.value!=='no'}if(emailReachableSelect){emailReachableSelect.addEventListener('change',toggleContactInstruction);toggleContactInstruction()}
document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const lang=document.documentElement.lang;const t=I[lang]||I.en;const id=f.dataset.kind+'-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const r=f.querySelector('.result');const button=f.querySelector('button[type=submit]');const oldText=button.textContent;button.disabled=true;button.textContent=t.submitting;const payload=new FormData(f);payload.append('application_id',id);payload.append('application_type',f.dataset.kind);payload.append('site_language',lang);payload.append('submitted_at',new Date().toISOString());payload.append('_subject','Rebate Hub application '+id);payload.append('_template','table');payload.append('_captcha','false');const record={id,data:Object.fromEntries(payload),time:new Date().toISOString()};localStorage.setItem('last-'+f.dataset.kind,JSON.stringify(record));try{const response=await fetch(FORM_ENDPOINT,{method:'POST',body:payload,headers:{Accept:'application/json'}});if(!response.ok)throw new Error('submit failed');sessionStorage.setItem('lastApplication',JSON.stringify({id:id,type:f.dataset.kind,lang:lang}));window.location.href='success.html?ref='+encodeURIComponent(id)+'&type='+encodeURIComponent(f.dataset.kind)+'&lang='+encodeURIComponent(lang)}catch(error){r.textContent=t.submitError+id}finally{r.style.display='block';button.disabled=false;button.textContent=oldText}}));
