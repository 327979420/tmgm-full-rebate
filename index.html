function renderTable(lang){const p=P[lang]||P.en;let h='<thead><tr>'+p.heads.map((x,i)=>{const parts=x.split('｜');return `<th class="${i===5?'raw':''}">${parts[0]}${parts[1]?`<br><small>${parts[1]}</small>`:''}</th>`}).join('')+'</tr></thead><tbody>';h+=p.rows.map(r=>'<tr>'+r.map((x,i)=>{const tag=i?'td':'th',cl=i===5?' class="raw"':'';const parts=x.split('｜');return `<${tag}${cl}><span class="cell-main">${parts[0]}</span>${parts.slice(1).map(v=>`<span class="cell-sub">${v}</span>`).join('')}</${tag}>`}).join('')+'</tr>').join('')+'</tbody>';document.getElementById('policyTable').innerHTML=h}
