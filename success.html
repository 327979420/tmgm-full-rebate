<style>
:root{--navy:#061a44;--blue:#0b3f91;--cyan:#16b8d7;--gold:#d7a52a;--bg:#f4f7fb;--text:#14213d;--muted:#667085;--line:#dbe3ef;--success:#11845b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef5ff,#f8fafc);color:var(--text);line-height:1.65}.top{background:var(--navy);color:#fff}.nav,.wrap{width:min(900px,92%);margin:auto}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:24px;font-weight:950}.lang{border:0;border-radius:9px;padding:9px 10px}.main{padding:58px 0 76px}.success-card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px #061a4418;overflow:hidden}.success-head{padding:34px;background:linear-gradient(135deg,#061a44,#0b3f91);color:#fff}.check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e6fff5;color:var(--success);font-size:30px;font-weight:950;margin-bottom:18px}.success-head h1{font-size:clamp(32px,6vw,50px);line-height:1.12;margin:0 0 10px}.success-head p{margin:0;color:#dce9ff}.reference{display:inline-flex;gap:8px;align-items:center;margin-top:18px;padding:9px 12px;border-radius:999px;background:#ffffff16;border:1px solid #ffffff26;font-weight:800}.body{padding:34px}.critical{padding:20px;border-radius:15px;background:#fff2c9;border-left:6px solid var(--gold);margin-bottom:26px}.critical strong{display:block;font-size:21px;color:#4a3400;margin-bottom:6px}.critical p{margin:0;color:#5d470f;font-weight:700}.steps{display:grid;gap:14px;margin:24px 0}.step{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.num{width:38px;height:38px;border-radius:12px;background:#eaf6fb;color:#087289;display:grid;place-items:center;font-weight:950}.step h3{margin:0 0 3px}.step p{margin:0;color:var(--muted)}.warning{font-weight:900;color:#a13b00;background:#fff0e6;border-radius:12px;padding:14px 16px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;font-weight:850;text-decoration:none}.primary{background:linear-gradient(135deg,var(--cyan),#1678d2);color:#fff}.secondary{background:#edf4ff;color:var(--navy)}.foot{padding:22px 34px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}@media(max-width:600px){.main{padding:28px 0}.success-head,.body{padding:24px}.nav{padding:12px 0}.step{grid-template-columns:38px 1fr}.actions{display:grid}.btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="nav"><div class="brand" id="brand"></div><select id="lang" class="lang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option><option value="th">ไทย</option></select></div></header>

'th':{brand:'ศูนย์รีเบต',title:'ส่งใบสมัครแล้ว',subtitle:'ระบบได้รับใบสมัครของคุณแล้ว และยังมีอีกหนึ่งขั้นตอนที่จำเป็นต้องทำให้เสร็จ',refLabel:'หมายเลขอ้างอิง: ',criticalTitle:'ต้องยืนยันข้อตกลง',criticalText:'สิทธิ์รีเบตหรือ Introducing Broker จะไม่เปิดอัตโนมัติเพียงเพราะส่งแบบฟอร์ม คุณต้องเข้าสู่ระบบของแพลตฟอร์มที่เกี่ยวข้องและยืนยันข้อตกลงในหน้าเข้าสู่ระบบหรือพอร์ทัลลูกค้า',nextTitle:'ขั้นตอนถัดไปเพื่อเปิดสิทธิ์',s1t:'เข้าสู่บัญชีแพลตฟอร์ม',s1d:'ใช้ข้อมูลบัญชีที่สร้างตอนลงทะเบียนเพื่อเข้าสู่พอร์ทัลลูกค้าหรือหน้าเข้าสู่ระบบของแพลตฟอร์ม',s2t:'ค้นหาข้อตกลงที่รอยืนยัน',s2d:'ตรวจสอบหน้าเข้าสู่ระบบ ศูนย์แจ้งเตือน หรือข้อความในบัญชีสำหรับข้อตกลงรีเบตหรือ Introducing Broker',s3t:'อ่านและยืนยันข้อตกลง',s3d:'หลังตรวจสอบเงื่อนไขแล้ว ให้กดยืนยัน ยอมรับ หรือตกลง ห้ามข้ามขั้นตอนนี้',s4t:'รอเปิดสิทธิ์',s4d:'หลังยืนยันแล้ว รอให้แพลตฟอร์มเปิดสิทธิ์รีเบตหรือ Introducing Broker',warning:'หากไม่ยืนยันข้อตกลง สิทธิ์รีเบตหรือ Introducing Broker จะยังไม่เริ่มใช้งาน',contactBtn:'ติดต่อเจ้าหน้าที่',homeBtn:'กลับไปศูนย์รีเบต',foot:'หากเข้าสู่ระบบแล้วไม่พบข้อตกลง โปรดติดต่อเจ้าหน้าที่ผ่าน WeChat, QQ, Discord หรือ Telegram ที่ระบุไว้ในเว็บไซต์.'}}
const params=new URLSearchParams(location.search);const ref=params.get('ref')||'—';const queryLang=params.get('lang');const saved=localStorage.getItem('tmgm-lang');const browser=(navigator.language||'en').toLowerCase();const fallback=browser.startsWith('zh-tw')||browser.startsWith('zh-hk')?'zh-TW':browser.startsWith('zh')?'zh-CN':browser.startsWith('ms')?'ms':browser.startsWith('th')?'th':'en';function setLang(lang){if(!T[lang])lang='en';localStorage.setItem('tmgm-lang',lang);document.documentElement.lang=lang;document.getElementById('lang').value=lang;const t=T[lang];Object.keys(t).forEach(k=>{const el=document.getElementById(k);if(el)el.textContent=t[k]});document.getElementById('ref').textContent=ref}document.getElementById('lang').addEventListener('change',e=>setLang(e.target.value));setLang(queryLang||saved||fallback);
