name: Apply unified site update
# Trigger after workflow registration

on:
  push:
    paths:
      - .github/workflows/apply-unified-site-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_unified_update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/apply_unified_update.py .github/workflows/apply-unified-site-update.yml .github/workflows/unify-form-add-rebate-ticker.yml
          git commit -m "Unify application form and add historical rebate ticker"
          git push
