name: Fix logo, form and post-submit flow

on:
  push:
    paths:
      - .github/workflows/fix-logo-form-success.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update logo, form and success flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          # Use PNG instead of WebP for maximum browser compatibility.
          text = text.replace(
              'src="assets/ic-markets-official.webp" alt="IC Markets official logo"',
              'src="assets/ic-markets-official-v2.png" alt="IC Markets official logo"'
          )
          text = text.replace(
              '.platform-logo.ic-panel{background:linear-gradient(145deg,#050505,#11151a);border-color:#151a20;padding:8px}.platform-logo.ic-panel img{max-width:190px;max-height:86px;filter:drop-shadow(0 8px 16px #00000035)}',
              '.platform-logo.ic-panel{background:#fff;border-color:#e8edf4;padding:6px}.platform-logo.ic-panel img{max-width:88px;max-height:88px;filter:drop-shadow(0 8px 16px #00000022)}'
          )

          css_anchor = '.result{margin-top:15px;padding:12px;border-radius:9px;background:#edf8f4;color:#176b4d;display:none}'
          css_extra = css_anchor + '.conditional-note{margin:-2px 0 16px;padding:14px 15px;border-radius:11px;background:#fff4d6;border-left:5px solid var(--gold);color:#4d3800;font-size:14px;font-weight:750}.conditional-note[hidden]{display:none}'
          if '.conditional-note{' not in text:
              if css_anchor not in text:
                  raise SystemExit('Form CSS anchor not found')
              text = text.replace(css_anchor, css_extra)

          new_rebate_form = '''<form class="form-card" data-kind="REB"><h3 data-t="rebateForm"></h3><div class="field"><label data-t="platform"></label><select name="platform" required><option value="TMGM">TMGM</option><option disabled data-t="ecSoon"></option><option disabled data-t="icSoon"></option><option disabled data-t="exSoon"></option></select></div><div class="field"><label data-t="registeredEmailQ"></label><input name="registered_email" type="email" autocomplete="email" required></div><div class="field"><label data-t="registeredWithinQ"></label><select name="registered_within_3_days" required><option value="" data-t="pleaseSelect"></option><option value="yes" data-t="yesOption"></option><option value="no" data-t="noOption"></option></select></div><div class="field"><label data-t="emailReachableQ"></label><select id="emailReachable" name="reachable_via_registered_email" required><option value="" data-t="pleaseSelect"></option><option value="yes" data-t="yesOption"></option><option value="no" data-t="noOption"></option></select></div><div id="contactInstruction" class="conditional-note" data-t="contactInstruction" hidden></div><label class="check"><input type="checkbox" required><span data-t="consent"></span></label><button class="btn btn-primary" type="submit" data-t="submit"></button><div class="result"></div></form>'''

          pattern = re.compile(r'<form class="form-card" data-kind="REB">.*?</form>\s*<form class="form-card" data-kind="IB">', re.S)
          if not pattern.search(text):
              raise SystemExit('Rebate form block not found')
          text = pattern.sub(new_rebate_form + '\n<form class="form-card" data-kind="IB">', text, count=1)

          translation_replacements = {
              "platform:'申请平台',ecSoon:": "platform:'申请平台',registeredEmailQ:'问题1：平台账户的注册邮箱',registeredWithinQ:'问题2：是否为3天内注册？',emailReachableQ:'问题3：是否能通过注册邮箱联系？',pleaseSelect:'请选择',yesOption:'是',noOption:'否',contactInstruction:'如选择“否”，请通过网站内提供的微信、QQ、Discord或Telegram添加工作人员，确保返佣权限能够顺利开启。',ecSoon:",
              "platform:'申請平台',ecSoon:": "platform:'申請平台',registeredEmailQ:'問題1：平台帳戶的註冊電郵',registeredWithinQ:'問題2：是否在3天內註冊？',emailReachableQ:'問題3：是否能透過註冊電郵聯絡？',pleaseSelect:'請選擇',yesOption:'是',noOption:'否',contactInstruction:'如選擇「否」，請透過網站內提供的微信、QQ、Discord或Telegram添加工作人員，確保返佣權限能夠順利開啟。',ecSoon:",
              "platform:'Application platform',ecSoon:": "platform:'Application platform',registeredEmailQ:'Question 1: Registered email for the platform account',registeredWithinQ:'Question 2: Was the account registered within the last 3 days?',emailReachableQ:'Question 3: Can we contact you through the registered email?',pleaseSelect:'Please select',yesOption:'Yes',noOption:'No',contactInstruction:'If you select “No”, add a staff member through the WeChat, QQ, Discord or Telegram options provided on this website so the rebate permission can be activated smoothly.',ecSoon:",
              "platform:'Platform permohonan',ecSoon:": "platform:'Platform permohonan',registeredEmailQ:'Soalan 1: E-mel berdaftar untuk akaun platform',registeredWithinQ:'Soalan 2: Adakah akaun didaftarkan dalam tempoh 3 hari?',emailReachableQ:'Soalan 3: Bolehkah kami menghubungi anda melalui e-mel berdaftar?',pleaseSelect:'Sila pilih',yesOption:'Ya',noOption:'Tidak',contactInstruction:'Jika anda memilih “Tidak”, tambah kakitangan melalui WeChat, QQ, Discord atau Telegram yang disediakan di laman ini supaya kebenaran rebat dapat diaktifkan dengan lancar.',ecSoon:",
              "platform:'แพลตฟอร์มที่สมัคร',ecSoon:": "platform:'แพลตฟอร์มที่สมัคร',registeredEmailQ:'คำถาม 1: อีเมลที่ลงทะเบียนของบัญชีแพลตฟอร์ม',registeredWithinQ:'คำถาม 2: บัญชีนี้ลงทะเบียนภายใน 3 วันหรือไม่?',emailReachableQ:'คำถาม 3: สามารถติดต่อคุณผ่านอีเมลที่ลงทะเบียนได้หรือไม่?',pleaseSelect:'โปรดเลือก',yesOption:'ใช่',noOption:'ไม่',contactInstruction:'หากเลือก “ไม่” โปรดเพิ่มเจ้าหน้าที่ผ่าน WeChat, QQ, Discord หรือ Telegram ที่ระบุไว้ในเว็บไซต์ เพื่อให้สามารถเปิดสิทธิ์รีเบตได้อย่างราบรื่น',ecSoon:"
          }
          for old, new in translation_replacements.items():
              if old not in text:
                  raise SystemExit('Translation anchor not found: ' + old)
              text = text.replace(old, new, 1)

          js_anchor = "document.getElementById('lang').addEventListener('change',e=>setLang(e.target.value));"
          js_extra = js_anchor + "\nconst emailReachableSelect=document.getElementById('emailReachable');const contactInstruction=document.getElementById('contactInstruction');function toggleContactInstruction(){if(!emailReachableSelect||!contactInstruction)return;contactInstruction.hidden=emailReachableSelect.value!=='no'}if(emailReachableSelect){emailReachableSelect.addEventListener('change',toggleContactInstruction);toggleContactInstruction()}"
          if 'function toggleContactInstruction()' not in text:
              if js_anchor not in text:
                  raise SystemExit('Language JS anchor not found')
              text = text.replace(js_anchor, js_extra, 1)

          old_success = "if(!response.ok)throw new Error('submit failed');r.textContent=t.success+id;f.reset()}catch(error)"
          new_success = "if(!response.ok)throw new Error('submit failed');sessionStorage.setItem('lastApplication',JSON.stringify({id:id,type:f.dataset.kind,lang:lang}));window.location.href='success.html?ref='+encodeURIComponent(id)+'&type='+encodeURIComponent(f.dataset.kind)+'&lang='+encodeURIComponent(lang)}catch(error)"
          if old_success not in text:
              raise SystemExit('Submit success handler not found')
          text = text.replace(old_success, new_success, 1)

          index.write_text(text, encoding='utf-8')

          logo_b64 = ''''''
          Path('assets/ic-markets-official-v2.png').write_bytes(base64.b64decode(logo_b64))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ic-markets-official-v2.png
          git rm .github/workflows/fix-logo-form-success.yml
          git commit -m "Fix IC logo and optimize rebate application flow"
          git push
