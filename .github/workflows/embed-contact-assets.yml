name: Embed contact QR codes and privacy link

on:
  push:
    paths:
      - .github/workflows/embed-contact-assets.yml

permissions:
  contents: write

jobs:
  embed-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate contact QR codes
        run: |
          python3 -m pip install --quiet qrcode
          python3 - <<'PY'
          from pathlib import Path
          import qrcode
          import qrcode.image.svg
          Path('assets').mkdir(exist_ok=True)
          links={
            'qq-qr.svg':'https://qm.qq.com/q/WJBVC3uE8M',
            'wechat-qr.svg':'https://u.wechat.com/kHj45VpIFXCSN5JV-zx8xUc?s=2'
          }
          for filename,url in links.items():
              image=qrcode.make(url,image_factory=qrcode.image.svg.SvgPathImage,box_size=10,border=4)
              image.save(str(Path('assets')/filename))
          PY
      - name: Insert QR images and privacy link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
            '.qr-placeholder{aspect-ratio:1;border:2px dashed #9db0ca;border-radius:16px;display:grid;place-items:center;color:var(--muted);margin-bottom:15px;background:#f8fbff;padding:20px}',
            '.qr-placeholder{aspect-ratio:1;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;margin-bottom:15px;background:#fff;padding:12px}.qr-image{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px}.footer a{color:#7de4f3;text-decoration:underline}'
          )
          text=text.replace(
            '<article class="contact-card"><div class="qr-placeholder" data-t="qqQr"></div><h3>QQ</h3><p data-t="qrPending"></p></article>',
            '<article class="contact-card"><a class="qr-placeholder" href="https://qm.qq.com/q/WJBVC3uE8M" target="_blank" rel="noopener"><img class="qr-image" src="assets/qq-qr.svg" alt="QQ QR code"></a><h3>QQ</h3><p data-t="scanQr"></p></article>'
          )
          text=text.replace(
            '<article class="contact-card"><div class="qr-placeholder" data-t="wechatQr"></div><h3>WeChat</h3><p data-t="qrPending"></p></article>',
            '<article class="contact-card"><a class="qr-placeholder" href="https://u.wechat.com/kHj45VpIFXCSN5JV-zx8xUc?s=2" target="_blank" rel="noopener"><img class="qr-image" src="assets/wechat-qr.svg" alt="WeChat QR code"></a><h3>WeChat</h3><p data-t="scanQr"></p></article>'
          )
          text=text.replace(
            '<strong>TMGM满返网</strong><p data-t="footerIdentity"></p><p class="risk" data-t="risk"></p>',
            '<strong>TMGM满返网</strong><p data-t="footerIdentity"></p><p><a href="privacy.html" data-t="privacyLink"></a></p><p class="risk" data-t="risk"></p>'
          )
          translations={
            'zh-CN':{'scanQr':'扫描二维码或点击打开','privacyLink':'隐私说明'},
            'zh-TW':{'scanQr':'掃描二維碼或點擊開啟','privacyLink':'私隱說明'},
            'en':{'scanQr':'Scan the QR code or open the link','privacyLink':'Privacy notice'},
            'ms':{'scanQr':'Imbas kod QR atau buka pautan','privacyLink':'Notis privasi'},
            'th':{'scanQr':'สแกนคิวอาร์โค้ดหรือเปิดลิงก์','privacyLink':'ประกาศความเป็นส่วนตัว'}
          }
          lines=text.splitlines()
          inside=False
          for i,line in enumerate(lines):
              if line.strip()=='const I={': inside=True; continue
              if line.strip()=='const P={': inside=False
              if inside:
                  for lang,values in translations.items():
                      if line.startswith(f"'{lang}':{{"):
                          for key,value in values.items():
                              if f"{key}:" not in line:
                                  escaped=value.replace("'","\\'")
                                  line=line[:-2]+f",{key}:'{escaped}'"+line[-2:]
                          lines[i]=line
                          break
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit QR assets and privacy link
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/qq-qr.svg assets/wechat-qr.svg
          git commit -m "Embed QQ and WeChat QR codes and privacy link"
          git push