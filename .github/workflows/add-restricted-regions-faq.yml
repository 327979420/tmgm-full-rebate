name: Add restricted regions FAQ

on:
  push:
    paths:
      - .github/workflows/add-restricted-regions-faq.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add FAQ in five languages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          faq_html = '<details><summary data-t="faq5q"></summary><p data-t="faq5a"></p></details><details><summary data-t="faq6q"></summary><p data-t="faq6a"></p></details></div></section>'
          old_html = '<details><summary data-t="faq5q"></summary><p data-t="faq5a"></p></details></div></section>'
          if 'data-t="faq6q"' not in text:
              if old_html not in text:
                  raise SystemExit('FAQ HTML anchor not found')
              text = text.replace(old_html, faq_html, 1)

          replacements = {
              "faq5q:'网站会收集密码或证件吗？',faq5a:'不会。请勿提交交易密码、投资者密码、验证码、银行卡资料或证件图片。',contactTitle:": "faq5q:'网站会收集密码或证件吗？',faq5a:'不会。请勿提交交易密码、投资者密码、验证码、银行卡资料或证件图片。',faq6q:'哪些地区暂不支持开户或申请Introducing Broker？',faq6a:'当前不支持的地区包括：阿富汗、日本、朝鲜、美属维尔京群岛、美国本土外小岛屿、美国、伊朗、俄罗斯、索马里、刚果（金）、中非共和国、几内亚比绍、克里米亚、黎巴嫩、苏丹、利比亚、津巴布韦、也门、马里、委内瑞拉、古巴、白俄罗斯、叙利亚、南苏丹、缅甸、乌克兰、新加坡、罗马尼亚。实际操作上，如所在地区不在以上清单中，通常可以提交开户或Introducing Broker申请；最终是否获批仍以平台合规审核、身份认证和当地规则为准。',contactTitle:",
              "faq5q:'網站會收集密碼或證件嗎？',faq5a:'不會。請勿提交交易密碼、投資者密碼、驗證碼、銀行卡資料或證件圖片。',contactTitle:": "faq5q:'網站會收集密碼或證件嗎？',faq5a:'不會。請勿提交交易密碼、投資者密碼、驗證碼、銀行卡資料或證件圖片。',faq6q:'哪些地區暫不支援開戶或申請Introducing Broker？',faq6a:'目前不支援的地區包括：阿富汗、日本、北韓、美屬維爾京群島、美國本土外小島嶼、美國、伊朗、俄羅斯、索馬里、剛果民主共和國、中非共和國、幾內亞比索、克里米亞、黎巴嫩、蘇丹、利比亞、辛巴威、葉門、馬利、委內瑞拉、古巴、白俄羅斯、敘利亞、南蘇丹、緬甸、烏克蘭、新加坡及羅馬尼亞。實際操作上，如所在地區不在以上清單中，通常可提交開戶或Introducing Broker申請；最終是否獲批仍以平台合規審核、身份認證及當地規則為準。',contactTitle:",
              "faq5q:'Does the site collect passwords or identity documents?',faq5a:'No. Never submit trading or investor passwords, verification codes, card details or identity-document images.',contactTitle:": "faq5q:'Does the site collect passwords or identity documents?',faq5a:'No. Never submit trading or investor passwords, verification codes, card details or identity-document images.',faq6q:'Which regions are currently not supported for account opening or Introducing Broker applications?',faq6a:'The current restricted list includes Afghanistan, Japan, North Korea, the U.S. Virgin Islands, the United States Minor Outlying Islands, the United States, Iran, Russia, Somalia, the Democratic Republic of the Congo, the Central African Republic, Guinea-Bissau, Crimea, Lebanon, Sudan, Libya, Zimbabwe, Yemen, Mali, Venezuela, Cuba, Belarus, Syria, South Sudan, Myanmar, Ukraine, Singapore and Romania. In practice, applicants outside this list can usually submit an account-opening or Introducing Broker application, but final approval remains subject to platform compliance review, identity verification and local requirements.',contactTitle:",
              "faq5q:'Adakah laman mengumpul kata laluan atau dokumen identiti?',faq5a:'Tidak. Jangan hantar kata laluan dagangan atau pelabur, kod pengesahan, butiran kad atau imej dokumen identiti.',contactTitle:": "faq5q:'Adakah laman mengumpul kata laluan atau dokumen identiti?',faq5a:'Tidak. Jangan hantar kata laluan dagangan atau pelabur, kod pengesahan, butiran kad atau imej dokumen identiti.',faq6q:'Wilayah manakah yang kini tidak disokong untuk pembukaan akaun atau permohonan Introducing Broker?',faq6a:'Senarai sekatan semasa merangkumi Afghanistan, Jepun, Korea Utara, Kepulauan Virgin A.S., Kepulauan Terpencil Kecil A.S., Amerika Syarikat, Iran, Rusia, Somalia, Republik Demokratik Congo, Republik Afrika Tengah, Guinea-Bissau, Crimea, Lubnan, Sudan, Libya, Zimbabwe, Yaman, Mali, Venezuela, Cuba, Belarus, Syria, Sudan Selatan, Myanmar, Ukraine, Singapura dan Romania. Secara amnya, pemohon di luar senarai ini biasanya boleh menghantar permohonan pembukaan akaun atau Introducing Broker, tetapi kelulusan akhir tertakluk pada semakan pematuhan platform, pengesahan identiti dan peraturan tempatan.',contactTitle:",
              "faq5q:'เว็บไซต์เก็บรหัสผ่านหรือเอกสารยืนยันตัวตนหรือไม่?',faq5a:'ไม่เก็บ ห้ามส่งรหัสผ่านเทรดหรือรหัสผ่านนักลงทุน รหัสยืนยัน ข้อมูลบัตร หรือภาพเอกสารยืนยันตัวตน',contactTitle:": "faq5q:'เว็บไซต์เก็บรหัสผ่านหรือเอกสารยืนยันตัวตนหรือไม่?',faq5a:'ไม่เก็บ ห้ามส่งรหัสผ่านเทรดหรือรหัสผ่านนักลงทุน รหัสยืนยัน ข้อมูลบัตร หรือภาพเอกสารยืนยันตัวตน',faq6q:'พื้นที่ใดที่ยังไม่รองรับการเปิดบัญชีหรือการสมัคร Introducing Broker?',faq6a:'รายชื่อพื้นที่ที่ไม่รองรับในปัจจุบัน ได้แก่ อัฟกานิสถาน ญี่ปุ่น เกาหลีเหนือ หมู่เกาะเวอร์จินของสหรัฐ หมู่เกาะเล็กรอบนอกของสหรัฐ สหรัฐอเมริกา อิหร่าน รัสเซีย โซมาเลีย สาธารณรัฐประชาธิปไตยคองโก สาธารณรัฐแอฟริกากลาง กินี-บิสเซา ไครเมีย เลบานอน ซูดาน ลิเบีย ซิมบับเว เยเมน มาลี เวเนซุเอลา คิวบา เบลารุส ซีเรีย ซูดานใต้ เมียนมา ยูเครน สิงคโปร์ และโรมาเนีย โดยทั่วไป ผู้สมัครที่อยู่นอกเหนือรายชื่อนี้มักสามารถส่งคำขอเปิดบัญชีหรือสมัคร Introducing Broker ได้ แต่การอนุมัติขั้นสุดท้ายยังขึ้นอยู่กับการตรวจสอบด้านกำกับดูแล การยืนยันตัวตน และข้อกำหนดในพื้นที่ของแพลตฟอร์ม',contactTitle:"
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Translation anchor not found: ' + old[:70])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit FAQ update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-restricted-regions-faq.yml
          git commit -m "Add multilingual restricted regions FAQ"
          git push
