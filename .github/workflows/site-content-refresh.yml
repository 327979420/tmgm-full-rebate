name: Site content refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-content-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage and landing-page navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Homepage: add a visible rebate-knowledge navigation item and section.
          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_nav = '<nav class="navlinks"><a href="#platforms" data-t="navPlatforms"></a><a href="#tmgm" data-t="navTMGM"></a><a href="#forms" data-t="navApply"></a><a href="#faq" data-t="navFAQ"></a><a href="#contact" data-t="navContact"></a></nav>'
          new_nav = '<nav class="navlinks"><a href="#platforms" data-t="navPlatforms"></a><a href="#tmgm" data-t="navTMGM"></a><a href="#articles">返佣知识</a><a href="#forms" data-t="navApply"></a><a href="#faq" data-t="navFAQ"></a><a href="#contact" data-t="navContact"></a></nav>'
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          css = '''\n/* rebate-knowledge-section-v1 */\n.knowledge-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}\n.knowledge-card{display:flex;flex-direction:column;min-height:230px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px #061a440b;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}\n.knowledge-card:hover{transform:translateY(-2px);border-color:#9bcfe0;box-shadow:0 14px 32px #061a4414}\n.knowledge-card .knowledge-tag{display:inline-flex;align-self:flex-start;padding:5px 9px;border-radius:999px;background:#eaf6fb;color:#087289;font-size:11px;font-weight:900;letter-spacing:.4px;margin-bottom:14px}\n.knowledge-card h3{font-size:20px;line-height:1.35;margin:0 0 9px;color:var(--navy)}\n.knowledge-card p{margin:0 0 18px;color:var(--muted);font-size:14px;flex:1}\n.knowledge-card .read-more{font-weight:900;color:#0b64b5;font-size:14px}\n@media(max-width:1000px){.knowledge-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:600px){.knowledge-grid{grid-template-columns:1fr}.knowledge-card{min-height:0}}\n'''
          if '/* rebate-knowledge-section-v1 */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          section = '''\n<section class="section white" id="articles"><div class="container"><div class="heading"><h2>返佣知识</h2><p>了解TMGM返佣、满返、开户链接、账户类型与交易成本。持续更新真实、可计算、可核对的返佣知识。</p></div><div class="knowledge-grid">\n<a class="knowledge-card" href="tmgm-man-fan.html"><span class="knowledge-tag">满返基础</span><h3>TMGM满返是什么？</h3><p>了解满返的基本逻辑、适用账户、申请流程，以及新老账户需要注意的问题。</p><span class="read-more">阅读文章 →</span></a>\n<a class="knowledge-card" href="tmgm-fan-yong.html"><span class="knowledge-tag">返佣指南</span><h3>TMGM返佣申请与结算说明</h3><p>从账户类型、有效手数到结算周期，理解返佣金额背后的完整成本结构。</p><span class="read-more">阅读文章 →</span></a>\n<a class="knowledge-card" href="tmgm-kai-hu.html"><span class="knowledge-tag">开户指南</span><h3>TMGM开户链接与开户注册</h3><p>通过正确入口完成注册，并在交易前确认账户归属与返佣关系。</p><span class="read-more">阅读文章 →</span></a>\n<a class="knowledge-card" href="tutorial-existing.html"><span class="knowledge-tag">老账户</span><h3>已有TMGM账户如何查询返佣资格？</h3><p>老账户不要重复注册，先了解代理归属、转组和人工审核的处理方式。</p><span class="read-more">阅读文章 →</span></a>\n</div></div></section>\n'''
          tutorial_section = '<section class="section white" id="tutorials">'
          forms_section = '<section class="section" id="forms">'
          if 'id="articles"' not in s and forms_section in s:
              s = s.replace(forms_section, section + forms_section, 1)

          path.write_text(s, encoding='utf-8')

          # Landing pages: remove duplicate TMGM满返 item and add knowledge hub link.
          old_landing_nav = '<nav class="navlinks"><a href="tmgm-man-fan.html">TMGM满返</a><a href="tmgm-fan-yong.html">TMGM返佣</a><a href="tmgm-kai-hu.html">TMGM开户链接</a><a href="index.html#forms">提交申请</a></nav>'
          new_landing_nav = '<nav class="navlinks"><a href="tmgm-fan-yong.html">TMGM返佣</a><a href="tmgm-kai-hu.html">TMGM开户链接</a><a href="index.html#articles">返佣知识</a><a href="index.html#forms">提交申请</a></nav>'
          for filename in ['tmgm-man-fan.html','tmgm-fan-yong.html','tmgm-kai-hu.html']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if old_landing_nav in text:
                  text = text.replace(old_landing_nav, new_landing_nav, 1)
                  p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tmgm-man-fan.html tmgm-fan-yong.html tmgm-kai-hu.html
          git rm .github/workflows/site-content-refresh.yml
          git commit -m "Add rebate knowledge section and clean navigation"
          git push
