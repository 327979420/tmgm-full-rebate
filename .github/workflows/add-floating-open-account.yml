name: Add floating open account action

on:
  push:
    paths:
      - .github/workflows/add-floating-open-account.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add fixed open-account button
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = r'''
          /* floating-open-account-v1 */
          .floating-open-account{
            position:fixed;
            left:22px;
            bottom:22px;
            z-index:92;
            display:inline-flex;
            align-items:center;
            gap:10px;
            min-height:48px;
            padding:12px 18px;
            border:1px solid #ffc65a;
            border-radius:999px;
            background:linear-gradient(135deg,#f7b733,#f26a21);
            color:#fff;
            font-size:14px;
            font-weight:900;
            line-height:1.15;
            white-space:nowrap;
            box-shadow:0 14px 34px #8f3f1638;
            transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
          }
          .floating-open-account:hover{
            transform:translateY(-2px);
            filter:brightness(1.04);
            box-shadow:0 18px 42px #8f3f1648;
          }
          .floating-open-account:focus-visible{
            outline:3px solid #ffd77888;
            outline-offset:3px;
          }
          .floating-open-account-icon{
            display:grid;
            place-items:center;
            width:26px;
            height:26px;
            flex:0 0 26px;
            border-radius:50%;
            background:#ffffff24;
            font-size:17px;
            font-weight:950;
          }
          @media(max-width:900px){
            .floating-open-account{
              left:13px;
              bottom:68px;
              min-height:44px;
              padding:10px 13px;
              gap:8px;
              font-size:12px;
              box-shadow:0 10px 28px #8f3f1638;
            }
            .floating-open-account-icon{
              width:23px;
              height:23px;
              flex-basis:23px;
              font-size:15px;
            }
          }
          '''

          if '/* floating-open-account-v1 */' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          button = r'''
          <a class="floating-open-account referral" target="_blank" rel="noopener" aria-label="Open account">
            <span class="floating-open-account-icon">↗</span>
            <span data-t="openTMGM"></span>
          </a>
          '''

          if 'class="floating-open-account referral"' not in text:
              anchor = '<div class="floating-contact" id="floatingContact">'
              if anchor not in text:
                  raise SystemExit('Floating contact anchor not found')
              text = text.replace(anchor, button + '\n' + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-floating-open-account.yml
          git commit -m "Add fixed open account call to action"
          git push
