name: Retry Top IB visual update

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Add Daily Top IB header') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage visual update
        run: python3 .github/scripts/visual_layering_top_ib.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Daily Top IB header and stronger visual layers"
          git push
