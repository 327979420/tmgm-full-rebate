          form_js = r"""document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const lang=document.documentElement.lang;const t=I[lang]||I.en;const id=f.dataset.kind+'-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const r=f.querySelector('.result');const button=f.querySelector('button[type=submit]');const oldText=button.textContent;button.disabled=true;button.textContent=t.submitting||oldText;const payload=new FormData(f);payload.append('application_id',id);payload.append('application_type',f.dataset.kind);payload.append('site_language',lang);payload.append('submitted_at',new Date().toISOString());payload.append('_subject','TMGM website application '+id);payload.append('_template','table');payload.append('_captcha','false');const record={id,data:Object.fromEntries(payload),time:new Date().toISOString()};localStorage.setItem('last-'+f.dataset.kind,JSON.stringify(record));try{const response=await fetch('https://formsubmit.co/ajax/freddy.liang@tmgm.com',{method:'POST',body:payload,headers:{Accept:'application/json'}});if(!response.ok)throw new Error('submit failed');r.textContent=t.success+id;f.reset()}catch(error){r.textContent=(t.submitError||t.success)+id}finally{r.style.display='block';button.disabled=false;button.textContent=oldText}}));"""
