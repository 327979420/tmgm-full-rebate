name: Fix rebate knowledge i18n
on:
  push:
    paths:
      - '.github/workflows/fix-rebate-knowledge-i18n.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make rebate knowledge section multilingual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          replacements={
            '<a href="#articles">返佣知识</a>':'<a href="#articles" data-t="navKnowledge"></a>',
            '<h2>返佣知识</h2>':'<h2 data-t="knowledgeTitle"></h2>',
            '<p>了解TMGM返佣、满返、开户链接、账户类型与交易成本。持续更新真实、可计算、可核对的返佣知识。</p>':'<p data-t="knowledgeDesc"></p>',
            '<span class="knowledge-tag">满返基础</span>':'<span class="knowledge-tag" data-t="k1tag"></span>',
            '<h3>TMGM满返是什么？</h3>':'<h3 data-t="k1t"></h3>',
            '<p>了解满返的基本逻辑、适用账户、申请流程，以及新老账户需要注意的问题。</p>':'<p data-t="k1d"></p>',
            '<span class="knowledge-tag">返佣指南</span>':'<span class="knowledge-tag" data-t="k2tag"></span>',
            '<h3>TMGM返佣申请与结算说明</h3>':'<h3 data-t="k2t"></h3>',
            '<p>从账户类型、有效手数到结算周期，理解返佣金额背后的完整成本结构。</p>':'<p data-t="k2d"></p>',
            '<span class="knowledge-tag">开户指南</span>':'<span class="knowledge-tag" data-t="k3tag"></span>',
            '<h3>TMGM开户链接与开户注册</h3>':'<h3 data-t="k3t"></h3>',
            '<p>了解正确开户链接、身份认证、账户开通以及返佣关系确认流程。</p>':'<p data-t="k3d"></p>',
            '<span class="knowledge-tag">老账户</span>':'<span class="knowledge-tag" data-t="k4tag"></span>',
            '<h3>已有TMGM账户如何查询返佣资格</h3>':'<h3 data-t="k4t"></h3>',
            '<p>老账户不要重复开户，先查询账户归属、注册时间和是否可以调整返佣关系。</p>':'<p data-t="k4d"></p>',
            '<span class="read-more">阅读文章 →</span>':'<span class="read-more" data-t="readArticle"></span>',
          }
          for old,new in replacements.items():
            s=s.replace(old,new)

          lang_inserts={
            "navContact:'联系方式',viewPlatforms:":"navContact:'联系方式',navKnowledge:'返佣知识',knowledgeTitle:'返佣知识',knowledgeDesc:'了解TMGM返佣、满返、开户链接、账户类型与交易成本。持续更新真实、可计算、可核对的返佣知识。',k1tag:'满返基础',k1t:'TMGM满返是什么？',k1d:'了解满返的基本逻辑、适用账户、申请流程，以及新老账户需要注意的问题。',k2tag:'返佣指南',k2t:'TMGM返佣申请与结算说明',k2d:'从账户类型、有效手数到结算周期，理解返佣金额背后的完整成本结构。',k3tag:'开户指南',k3t:'TMGM开户链接与开户注册',k3d:'了解正确开户链接、身份认证、账户开通以及返佣关系确认流程。',k4tag:'老账户',k4t:'已有TMGM账户如何查询返佣资格',k4d:'老账户不要重复开户，先查询账户归属、注册时间和是否可以调整返佣关系。',readArticle:'阅读文章 →',viewPlatforms:",
            "navContact:'聯絡方式',viewPlatforms:":"navContact:'聯絡方式',navKnowledge:'返佣知識',knowledgeTitle:'返佣知識',knowledgeDesc:'了解TMGM返佣、滿返、開戶連結、帳戶類型與交易成本。持續更新真實、可計算、可核對的返佣知識。',k1tag:'滿返基礎',k1t:'TMGM滿返是什麼？',k1d:'了解滿返的基本邏輯、適用帳戶、申請流程，以及新舊帳戶需要注意的問題。',k2tag:'返佣指南',k2t:'TMGM返佣申請與結算說明',k2d:'從帳戶類型、有效手數到結算週期，理解返佣金額背後的完整成本結構。',k3tag:'開戶指南',k3t:'TMGM開戶連結與帳戶註冊',k3d:'了解正確開戶連結、身份認證、帳戶開通以及返佣關係確認流程。',k4tag:'舊帳戶',k4t:'已有TMGM帳戶如何查詢返佣資格',k4d:'舊帳戶不要重複開戶，先查詢帳戶歸屬、註冊時間以及是否可以調整返佣關係。',readArticle:'閱讀文章 →',viewPlatforms:",
            "navContact:'Contact',viewPlatforms:":"navContact:'Contact',navKnowledge:'Rebate Knowledge',knowledgeTitle:'Rebate Knowledge',knowledgeDesc:'Learn about TMGM rebates, full rebates, account-opening links, account types and trading costs with clear and verifiable explanations.',k1tag:'Full Rebate Basics',k1t:'What is a TMGM full rebate?',k1d:'Understand how full rebates work, eligible accounts, the application process, and key points for new and existing accounts.',k2tag:'Rebate Guide',k2t:'TMGM rebate application and settlement',k2d:'Understand the full cost structure behind rebates, from account types and eligible lots to settlement cycles.',k3tag:'Account Opening',k3t:'TMGM account-opening link and registration',k3d:'Learn about the correct registration link, identity verification, account activation and rebate attribution.',k4tag:'Existing Accounts',k4t:'How to check rebate eligibility for an existing TMGM account',k4d:'Do not open duplicate accounts. Check account attribution, registration time and whether the rebate relationship can be adjusted.',readArticle:'Read article →',viewPlatforms:",
            "navContact:'Hubungi',viewPlatforms:":"navContact:'Hubungi',navKnowledge:'Ilmu Rebat',knowledgeTitle:'Ilmu Rebat',knowledgeDesc:'Ketahui tentang rebat TMGM, rebat penuh, pautan pembukaan akaun, jenis akaun dan kos dagangan dengan penerangan yang jelas dan boleh disemak.',k1tag:'Asas Rebat Penuh',k1t:'Apakah rebat penuh TMGM?',k1d:'Fahami cara rebat penuh berfungsi, akaun yang layak, proses permohonan dan perkara penting untuk akaun baharu serta sedia ada.',k2tag:'Panduan Rebat',k2t:'Permohonan dan penyelesaian rebat TMGM',k2d:'Fahami struktur kos lengkap di sebalik rebat, daripada jenis akaun dan lot layak hingga kitaran penyelesaian.',k3tag:'Pembukaan Akaun',k3t:'Pautan pembukaan dan pendaftaran akaun TMGM',k3d:'Ketahui pautan pendaftaran yang betul, pengesahan identiti, pengaktifan akaun dan pengesahan hubungan rebat.',k4tag:'Akaun Sedia Ada',k4t:'Cara menyemak kelayakan rebat akaun TMGM sedia ada',k4d:'Jangan buka akaun pendua. Semak hubungan akaun, masa pendaftaran dan sama ada hubungan rebat boleh dilaraskan.',readArticle:'Baca artikel →',viewPlatforms:",
            "navContact:'ติดต่อ',viewPlatforms:":"navContact:'ติดต่อ',navKnowledge:'ความรู้เรื่องรีเบต',knowledgeTitle:'ความรู้เรื่องรีเบต',knowledgeDesc:'เรียนรู้เกี่ยวกับรีเบต TMGM รีเบตเต็ม ลิงก์เปิดบัญชี ประเภทบัญชี และต้นทุนการเทรดด้วยข้อมูลที่ชัดเจนและตรวจสอบได้',k1tag:'พื้นฐานรีเบตเต็ม',k1t:'รีเบตเต็มของ TMGM คืออะไร?',k1d:'ทำความเข้าใจหลักการของรีเบตเต็ม บัญชีที่ใช้ได้ ขั้นตอนสมัคร และข้อควรรู้สำหรับบัญชีใหม่และบัญชีเดิม',k2tag:'คู่มือรีเบต',k2t:'การสมัครและการชำระรีเบต TMGM',k2d:'เข้าใจโครงสร้างต้นทุนทั้งหมดของรีเบต ตั้งแต่ประเภทบัญชี ล็อตที่มีสิทธิ์ ไปจนถึงรอบการชำระ',k3tag:'เปิดบัญชี',k3t:'ลิงก์เปิดบัญชีและการลงทะเบียน TMGM',k3d:'เรียนรู้ลิงก์ลงทะเบียนที่ถูกต้อง การยืนยันตัวตน การเปิดใช้งานบัญชี และการยืนยันความสัมพันธ์รีเบต',k4tag:'บัญชีเดิม',k4t:'วิธีตรวจสอบสิทธิ์รีเบตของบัญชี TMGM ที่มีอยู่',k4d:'ไม่ควรเปิดบัญชีซ้ำ ให้ตรวจสอบการเชื่อมโยงบัญชี เวลาที่ลงทะเบียน และว่าสามารถปรับความสัมพันธ์รีเบตได้หรือไม่',readArticle:'อ่านบทความ →',viewPlatforms:",
          }
          for needle,repl in lang_inserts.items():
            if needle not in s:
              raise SystemExit(f'Missing language insertion point: {needle}')
            s=s.replace(needle,repl,1)

          # Ensure every knowledge-card read-more label is translated, even when multiple identical spans exist.
          s=s.replace('<span class="read-more">阅读文章 →</span>','<span class="read-more" data-t="readArticle"></span>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make rebate knowledge section multilingual"
          git push
