name: Finalize IC logo and multilingual tagline

on:
  push:
    paths:
      - .github/workflows/finalize-ic-brand.yml

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[site-polish-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final website polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          replacements = {
              "'zh-CN':{brand:'满返网',brandSub:'多平台返佣与客户服务'": "'zh-CN':{brand:'满返网',brandSub:'0抽成，完全满返，团队代理合作'",
              "'zh-TW':{brand:'滿返網',brandSub:'多平台返佣與客戶服務'": "'zh-TW':{brand:'滿返網',brandSub:'0抽成，完全滿返，團隊代理合作'",
              "'en':{brand:'Rebate Hub',brandSub:'Multi-platform rebates and client support'": "'en':{brand:'Rebate Hub',brandSub:'0% service cut, full rebates, team & Introducing Broker partnerships'",
              "'ms':{brand:'Hab Rebat',brandSub:'Rebat berbilang platform dan sokongan pelanggan'": "'ms':{brand:'Hab Rebat',brandSub:'0% potongan perkhidmatan, rebat penuh, kerjasama pasukan & Introducing Broker'",
              "'th':{brand:'ศูนย์รีเบต',brandSub:'รีเบตหลายแพลตฟอร์มและบริการลูกค้า'": "'th':{brand:'ศูนย์รีเบต',brandSub:'หักค่าบริการ 0% รีเบตเต็ม และความร่วมมือแบบทีมกับ Introducing Broker'",
              '<div class="platform-logo"><img src="assets/ic-markets-official.png" alt="IC Markets official logo"></div>': '<div class="platform-logo ic-panel"><img src="assets/ic-markets-official.webp" alt="IC Markets official logo"></div>'
          }

          for old, new in replacements.items():
              if old not in text:
                  print('Pattern not found or already updated:', old[:100])
              text = text.replace(old, new)

          css_anchor = '.platform-logo.exness-panel{background:#061024;border-color:#061024}.platform-logo.exness-panel img{max-width:220px;max-height:58px}'
          css_insert = css_anchor + '.platform-logo.ic-panel{background:linear-gradient(145deg,#050505,#11151a);border-color:#151a20;padding:8px}.platform-logo.ic-panel img{max-width:190px;max-height:86px;filter:drop-shadow(0 8px 16px #00000035)}'
          if '.platform-logo.ic-panel{' not in text:
              if css_anchor not in text:
                  raise SystemExit('IC logo CSS anchor not found')
              text = text.replace(css_anchor, css_insert)

          index.write_text(text, encoding='utf-8')

          logo_b64 = ''''''
          Path('assets/ic-markets-official.webp').write_bytes(base64.b64decode(logo_b64))
          PY

      - name: Commit final version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ic-markets-official.webp
          git rm .github/workflows/finalize-ic-brand.yml
          git commit -m "Finalize IC logo and multilingual brand tagline [site-polish-done]"
          git push
