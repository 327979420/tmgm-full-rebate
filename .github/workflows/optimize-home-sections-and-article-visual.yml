name: Optimize homepage sections and article visuals
on:
  push:
    paths:
      - '.github/workflows/optimize-home-sections-and-article-visual.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve article visuals and homepage grouping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # --- Article visuals: Chinese + English ---
          article_jobs = [
            (
              'rebate-ib-guide.html',
              '<meta property="og:url" content="https://max-rebate.com/rebate-ib-guide.html">',
              '<meta property="og:url" content="https://max-rebate.com/rebate-ib-guide.html">\n<meta property="og:image" content="https://max-rebate.com/assets/forex-rebate-market.svg">\n<meta name="twitter:card" content="summary_large_image">',
              '<div class="notice"><strong>先说结论：</strong>返佣不是额外的交易利润。它本质上是IB把自己从合资格交易中获得的部分或全部佣金返还给客户，用来降低已经发生的交易成本。</div>',
              '<div class="notice"><strong>先说结论：</strong>返佣不是额外的交易利润。它本质上是IB把自己从合资格交易中获得的部分或全部佣金返还给客户，用来降低已经发生的交易成本。</div>\n<figure class="article-visual"><img src="assets/forex-rebate-market.svg" width="1600" height="900" alt="外汇交易市场、主要货币对与K线图示意图"><figcaption>外汇交易成本通常由点差、手续费与返佣共同决定。返佣的价值要放在完整交易成本里理解。</figcaption></figure>'
            ),
            (
              'rebate-ib-guide-en.html',
              '<meta property="og:url" content="https://max-rebate.com/rebate-ib-guide-en.html">',
              '<meta property="og:url" content="https://max-rebate.com/rebate-ib-guide-en.html">\n<meta property="og:image" content="https://max-rebate.com/assets/forex-rebate-market.svg">\n<meta name="twitter:card" content="summary_large_image">',
              '<div class="notice"><strong>Key point:</strong> A rebate is not extra trading profit. It is part or all of the eligible IB commission returned to the client to reduce trading costs that have already been incurred.</div>',
              '<div class="notice"><strong>Key point:</strong> A rebate is not extra trading profit. It is part or all of the eligible IB commission returned to the client to reduce trading costs that have already been incurred.</div>\n<figure class="article-visual"><img src="assets/forex-rebate-market.svg" width="1600" height="900" alt="Foreign exchange market with major currency pairs and candlestick charts"><figcaption>Forex trading costs are shaped by spreads, commissions and rebates together. Rebates make more sense when viewed as part of total trading cost.</figcaption></figure>'
            )
          ]

          article_css = '''\n.article-visual{margin:0 0 24px;background:#061a44;border:1px solid #d6e0eb;border-radius:18px;overflow:hidden;box-shadow:0 14px 34px #061a4416}\n.article-visual img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}\n.article-visual figcaption{padding:11px 15px;background:#f7fafc;color:#667085;font-size:13px;line-height:1.55;border-top:1px solid #dce4ee}\n@media(max-width:760px){.article-visual{border-radius:13px;margin-bottom:18px}}\n'''

          for fname, og_old, og_new, notice_old, notice_new in article_jobs:
            p = Path(fname)
            s = p.read_text(encoding='utf-8')
            if 'forex-rebate-market.svg' not in s:
              if og_old in s:
                s = s.replace(og_old, og_new, 1)
              if notice_old in s:
                s = s.replace(notice_old, notice_new, 1)
              else:
                raise SystemExit(f'Article notice marker not found: {fname}')
            if '.article-visual{' not in s:
              s = s.replace('</style>', article_css + '\n</style>', 1)
            p.write_text(s, encoding='utf-8')

          # --- Homepage: reduce visual fragmentation and group related sections ---
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Simplify desktop navigation: keep the four primary destinations.
          old_nav = '<nav class="navlinks"><a href="#platforms" data-t="navPlatforms"></a><a href="#tmgm" data-t="navTMGM"></a><a href="#articles" data-t="navKnowledge"></a><a href="#forms" data-t="navApply"></a><a href="#faq" data-t="navFAQ"></a><a href="#contact" data-t="navContact"></a></nav>'
          new_nav = '<nav class="navlinks"><a href="#platforms" data-t="navPlatforms"></a><a href="#tmgm" data-t="navTMGM"></a><a href="#articles" data-t="navKnowledge"></a><a href="#forms" data-t="navApply"></a></nav>'
          s = s.replace(old_nav, new_nav, 1)

          # Remove the duplicated SEO-guide block from the visible homepage.
          s = re.sub(r'\n<section class="section white" id="seo-guides">.*?</section>\n(?=</main>)', '\n', s, count=1, flags=re.S)

          # Group the page into three visual zones without adding new language-specific labels.
          if 'class="site-zone zone-start"' not in s:
            s = s.replace('<section class="section" id="process">', '<div class="site-zone zone-start">\n<section class="section" id="process">', 1)
            s = s.replace('<section class="section dark" id="apps">', '</div><!-- /zone-start -->\n<div class="site-zone zone-resources">\n<section class="section dark" id="apps">', 1)
            s = s.replace('<section class="section" id="forms">', '</div><!-- /zone-resources -->\n<div class="site-zone zone-support">\n<section class="section" id="forms">', 1)
            s = s.replace('\n</main>', '\n</div><!-- /zone-support -->\n</main>', 1)

          zone_css = '''\n/* professional-section-zones-v1 */\n.site-zone{position:relative;padding:22px 0 26px}\n.site-zone>.section{padding:48px 0;border-top:0}\n.zone-start{background:linear-gradient(180deg,#f7faff 0%,#edf3f9 100%);border-top:1px solid #dfe7f1;border-bottom:1px solid #dfe7f1}\n.zone-start>.section,.zone-start>.section.white{background:transparent}\n.zone-resources{background:#fff;border-bottom:1px solid #dfe7f1}\n.zone-resources>.section.white{background:transparent}\n.zone-resources>#apps{width:min(1180px,96%);margin:28px auto 12px;border-radius:24px;overflow:hidden;box-shadow:0 18px 42px #061a4420}\n.zone-support{background:linear-gradient(180deg,#eef3f8 0%,#f7f9fc 100%);border-bottom:1px solid #dfe7f1}\n.zone-support>.section,.zone-support>.section.white{background:transparent}\n.zone-start>.section+.section,.zone-resources>.section+.section,.zone-support>.section+.section{border-top:1px solid #dfe6ef}\n.zone-support>#forms{padding-top:58px}\n.zone-support>#faq,.zone-support>#contact{padding-top:38px;padding-bottom:42px}\n#process,#platforms,#tmgm,#apps,#tutorials,#articles,#forms,#faq,#contact{scroll-margin-top:124px}\n@media(max-width:900px){.site-zone{padding:12px 0 18px}.site-zone>.section{padding:42px 0}.zone-resources>#apps{width:100%;margin:18px 0 8px;border-radius:0;box-shadow:none}}\n'''
          if 'professional-section-zones-v1' not in s:
            s = s.replace('</style>', zone_css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rebate-ib-guide.html rebate-ib-guide-en.html assets/forex-rebate-market.svg
          git diff --cached --quiet && exit 0
          git commit -m "Polish article visuals and homepage section hierarchy"
          git push
