name: Refine hero and service timing copy

on:
  push:
    paths:
      - .github/workflows/refine-hero-copy.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine homepage copy and layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            "heroTitle:'多平台满返，一个入口'": "heroTitle:'交易返佣与IB合作'",
            "heroDesc:'选平台，提交申请，开启返佣或代理权限。'": "heroDesc:'提交申请，开启返佣或IB权限。'",
            "settleText:'合资格返佣通常在下一处理日进入指定账户。'": "settleText:'订单平仓后1个工作日到账。'",
            "existingText:'注册超过3天，可提交人工审核。'": "existingText:'注册超过3天，可提交人工审核。'",

            "heroTitle:'多平台滿返，一個入口'": "heroTitle:'交易返佣與IB合作'",
            "heroDesc:'選平台、提交申請，開啟返佣或代理權限。'": "heroDesc:'提交申請，開啟返佣或IB權限。'",
            "settleText:'合資格返佣通常於下一處理日進入指定帳戶。'": "settleText:'訂單平倉後1個工作日到帳。'",

            "heroTitle:'One hub for rebates and IB partnerships'": "heroTitle:'Trading Rebates & IB Partnerships'",
            "heroDesc:'Choose a platform, submit your details, and activate rebate or IB access.'": "heroDesc:'Apply for rebate or IB access.'",
            "settleText:'Eligible rebates are usually credited on the next processing day.'": "settleText:'One working day after the order is closed.'",
            "existingText:'Accounts older than three days can be submitted for manual review.'": "existingText:'Accounts older than 3 days can be submitted for manual review.'",

            "heroTitle:'Satu pusat untuk rebat dan kerjasama IB'": "heroTitle:'Rebat Dagangan & Kerjasama IB'",
            "heroDesc:'Pilih platform, hantar maklumat dan aktifkan akses rebat atau IB.'": "heroDesc:'Mohon akses rebat atau IB.'",
            "settleText:'Rebat layak biasanya dikreditkan pada hari pemprosesan berikutnya.'": "settleText:'Dikreditkan 1 hari bekerja selepas pesanan ditutup.'",
            "existingText:'Akaun melebihi tiga hari boleh dihantar untuk semakan manual.'": "existingText:'Akaun melebihi 3 hari boleh dihantar untuk semakan manual.'",

            "heroTitle:'ศูนย์เดียวสำหรับรีเบตและพาร์ทเนอร์ IB'": "heroTitle:'รีเบตการเทรดและความร่วมมือ IB'",
            "heroDesc:'เลือกแพลตฟอร์ม ส่งข้อมูล และเปิดสิทธิ์รีเบตหรือ IB'": "heroDesc:'สมัครเพื่อเปิดสิทธิ์รีเบตหรือ IB'",
            "settleText:'รีเบตที่มีคุณสมบัติมักเข้าบัญชีในวันประมวลผลถัดไป'": "settleText:'เข้าบัญชีภายใน 1 วันทำการหลังปิดออเดอร์'",
            "existingText:'บัญชีที่เปิดเกิน 3 วันสามารถส่งให้เจ้าหน้าที่ตรวจสอบได้'": "existingText:'บัญชีที่เปิดเกิน 3 วันสามารถส่งให้เจ้าหน้าที่ตรวจสอบได้'",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # Remove the opening “How to apply” card completely.
          text, removed = re.subn(
              r'<aside class="hero-card"><h2 data-t="quickTitle"></h2><ol>.*?</aside>',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1 and 'class="hero-card"' in text:
              raise SystemExit('Hero application card was not removed')

          css = r'''
          /* concise-professional-hero-v1 */
          .hero{padding:44px 0 40px}
          .hero-grid{display:block;max-width:900px;margin:0 auto}
          .hero h1{max-width:880px;margin:0 0 11px;font-size:clamp(38px,5vw,60px);line-height:1.04;letter-spacing:-.035em}
          .hero p{max-width:680px;font-size:16px;line-height:1.55}
          .hero-actions{margin-top:18px}
          .hero .notice{max-width:680px;margin-top:17px}
          #tmgm .info-grid .card:nth-child(2) p{color:#0b3f91;font-size:16px;font-weight:850}
          @media(max-width:600px){
            .hero{padding:34px 0 32px}
            .hero h1{font-size:36px}
            .hero-actions{margin-top:15px}
          }
          '''
          if '/* concise-professional-hero-v1 */' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/refine-hero-copy.yml
          git commit -m "Refine homepage hero and timing copy"
          git push
