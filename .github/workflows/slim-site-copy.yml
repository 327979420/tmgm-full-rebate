name: Slim multilingual site copy

on:
  push:
    paths:
      - .github/workflows/slim-site-copy.yml

permissions:
  contents: write

jobs:
  slim-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify website copy
        run: |
          python3 - <<'PY'
