          markers = ["'zh-CN':{", "'zh-TW':{", "'en':{", "'ms':{", "'th':{"]
          for i, marker in enumerate(markers):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit('Missing language block: ' + marker)
              end_marker = markers[i + 1] if i + 1 < len(markers) else '};\nconst P='
              end = text.find(end_marker, start + len(marker))
              if end < 0:
                  raise SystemExit('Missing language block end: ' + marker)
              lang = marker.split("'")[1]
              segment = text[start:end]
              for key, value in copy[lang].items():
                  pattern = re.compile(r"(?<![A-Za-z0-9_])" + re.escape(key) + r":'[^']*'")
                  replacement = key + ":'" + value.replace("'", "\\'") + "'"
                  segment, count = pattern.subn(replacement, segment, count=1)
                  if count == 0:
                      print('Key not found:', lang, key)
              text = text[:start] + segment + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/slim-site-copy.yml
          git commit -m "Slim multilingual website copy"
          git push
