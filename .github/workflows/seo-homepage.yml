name: Update homepage SEO

on:
  push:
    paths:
      - '.github/workflows/seo-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage metadata and internal links
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_head = '''<meta name="description" content="满返网提供返佣申请、团队代理合作与平台开户服务。">
          <meta name="theme-color" content="#061a44">
          <title>满返网｜0抽成·完全满返·团队代理合作</title>'''
          new_head = '''<meta name="description" content="满返网提供TMGM满返、TMGM返佣申请、开户链接、账户类型、返佣标准和申请教程。独立客户服务网站，并非TMGM官方网站。">
          <meta name="robots" content="index,follow,max-image-preview:large">
          <link rel="canonical" href="https://max-rebate.com/">
          <meta property="og:type" content="website">
          <meta property="og:title" content="TMGM满返与返佣申请｜满返网">
          <meta property="og:description" content="查看TMGM满返标准、返佣申请流程、开户链接、账户类型和常见问题。">
          <meta property="og:url" content="https://max-rebate.com/">
          <meta name="theme-color" content="#061a44">
          <title>TMGM满返与返佣申请｜开户链接与返佣标准｜满返网</title>
          <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"满返网","url":"https://max-rebate.com/","description":"TMGM满返、返佣申请、开户链接、账户类型和申请教程。"}</script>'''
          if old_head in text:
              text = text.replace(old_head, new_head, 1)

          old_copy = "heroTitle:'交易返佣与IB合作',heroDesc:'提交申请，开启返佣或IB权限。'"
          new_copy = "heroTitle:'TMGM满返、返佣与IB合作',heroDesc:'满返网提供TMGM满返、TMGM返佣申请、开户链接、账户类型说明与申请教程。'"
          if old_copy in text:
              text = text.replace(old_copy, new_copy, 1)

          if 'id="seo-guides"' not in text:
              guide_section = '''
          <section class="section white" id="seo-guides"><div class="container"><div class="heading"><h2>TMGM满返与返佣指南</h2><p>了解TMGM满返、返佣申请、开户链接、账户组别和老账户处理流程。</p></div><div class="tutorials"><a class="card tutorial-link" href="tmgm-man-fan.html"><h3>TMGM满返</h3><p>满返含义、申请条件、结算方式与常见限制。</p></a><a class="card tutorial-link" href="tmgm-fan-yong.html"><h3>TMGM返佣</h3><p>返佣计算、账户类型、申请步骤和到账说明。</p></a><a class="card tutorial-link" href="tmgm-kai-hu.html"><h3>TMGM开户链接</h3><p>开户注册、身份认证与返佣关系确认教程。</p></a></div></div></section>
          '''
              text = text.replace('</main>', guide_section + '</main>', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage SEO update
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage SEO changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve homepage TMGM SEO"
          git push
