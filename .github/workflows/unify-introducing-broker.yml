name: Unify Introducing Broker terminology

on:
  push:
    paths:
      - .github/workflows/unify-introducing-broker.yml

permissions:
  contents: write

jobs:
  update-terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Standardize and polish IB terminology
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('applyAgent', 'applyIB')
          text = text.replace('agentForm', 'ibForm')

          text = text.replace('代理', 'Introducing Broker')
          text = text.replace('Ejen', 'Introducing Broker')
          text = text.replace('ejen', 'Introducing Broker')
          text = text.replace('ตัวแทน', 'Introducing Broker')

          replacements = {
              'AGENT APPLICATION': 'INTRODUCING BROKER APPLICATION',
              'Agent Application': 'Introducing Broker Application',
              'agent application': 'Introducing Broker application',
              'Apply as agent': 'Apply as Introducing Broker',
              'agent access': 'Introducing Broker eligibility',
              'rebate or agent form': 'rebate or Introducing Broker form',
              'rebate or agent application': 'rebate or Introducing Broker application',
              'Rebate and agent setup tutorials': 'Rebate and Introducing Broker setup tutorials',
              'Confirm the agent agreement': 'Confirm the Introducing Broker agreement',
              'Agent application': 'Introducing Broker application',
              'Agent / commission-focused': 'Introducing Broker / commission-focused',
              '做Introducing Broker/刷佣金': 'Introducing Broker / 佣金策略',
              '申请Introducing Broker': '申请成为 Introducing Broker',
              '申請Introducing Broker': '申請成為 Introducing Broker',
              '成为Introducing Broker': '成為 Introducing Broker',
              '成為Introducing Broker': '成為 Introducing Broker',
              '与Introducing Broker': '与 Introducing Broker',
              '與Introducing Broker': '與 Introducing Broker',
              '和Introducing Broker': '和 Introducing Broker',
              '或Introducing Broker': '或 Introducing Broker',
              '确认Introducing Broker': '确认 Introducing Broker',
              '確認Introducing Broker': '確認 Introducing Broker',
              "ibForm:'Introducing Broker申请'": "ibForm:'Introducing Broker 申请'",
              "ibForm:'Introducing Broker申請'": "ibForm:'Introducing Broker 申請'",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # Add spacing where Thai text touches the English industry term.
          text = re.sub(r'([\u0E00-\u0E7F])Introducing Broker', r'\1 Introducing Broker', text)
          text = re.sub(r'Introducing Broker([\u0E00-\u0E7F])', r'Introducing Broker \1', text)

          forbidden = ['代理', 'Ejen', 'ejen', 'ตัวแทน']
          for term in forbidden:
              if term in text:
                  raise SystemExit(f'Forbidden legacy term remains: {term}')
          if re.search(r'\bagent\b', text, flags=re.I):
              matches = sorted(set(re.findall(r'.{0,30}\bagent\b.{0,30}', text, flags=re.I)))
              raise SystemExit('English legacy term remains: ' + repr(matches))

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updated website
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No terminology changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Introducing Broker wording"
          git push
