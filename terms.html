'zh-TW':{brand:'滿返網',back:'返回網站',title:'使用條款',intro:'使用本網站即表示你理解以下基本規則。',html:`<h2>網站用途</h2><p>滿返網提供返佣、開戶連結、帳戶類型、交易成本及Introducing Broker合作的一般資訊與申請支援，不構成個人金融、投資、法律或稅務建議。</p><h2>返佣與申請</h2><p>提交申請不代表一定獲批，也不保證返佣金額、到帳時間或持續資格。平台政策可能變更，最終以平台規則與審核為準。</p><h2>第三方平台</h2><p>第三方網站、應用及服務由其自身條款與私隱政策管理。</p><h2>交易風險</h2><p>返佣不會降低市場風險，也不保證盈利。歷史紀錄或示例不代表未來結果。</p><div class="trust-nav"><a href="about.html">關於我們</a><a href="privacy.html">私隱政策</a><a href="risk-disclaimer.html">風險聲明</a><a href="contact.html">聯絡我們</a></div><p class="meta">Last updated: 10 August 2026</p>`},
en:{brand:'Max Rebate',back:'Back to website',title:'Terms of Use',intro:'By using this site, you acknowledge these basic terms.',html:`<h2>1. Purpose of the site</h2><p>Max Rebate provides general information and application support relating to rebates, account opening, account types, trading costs and Introducing Broker partnerships. The content is not personal financial, investment, legal or tax advice.</p><h2>2. Information changes</h2><p>Platform policies, spreads, commissions, rebate rates, products, links, regional restrictions and review processes may change. The relevant platform's final rules and decisions prevail.</p><h2>3. Applications and rebates</h2><p>Submitting an application does not guarantee approval, a particular rebate amount, settlement time, account attribution or ongoing eligibility. Application references are used only to identify and follow up submissions.</p><h2>4. Third-party services</h2><p>Links to TMGM or other third-party sites, apps and services are governed by those parties' own terms, privacy policies and operational rules.</p><h2>5. User responsibilities</h2><ul><li>Provide information that is accurate and that you are entitled to provide.</li><li>Do not submit trading passwords, verification codes, card passwords, identity-document images or unnecessary sensitive information.</li><li>Assess whether trading products are suitable for your own circumstances and read the platform's official risk disclosures.</li></ul><h2>6. No guarantee of trading outcomes</h2><p>Rebates may reduce part of trading costs but do not reduce market risk or guarantee profit. Historical rebate records, examples and calculations do not indicate future outcomes.</p><h2>7. Acceptable use</h2><p>Do not use the site for fraudulent, false, duplicate, malicious or unlawful submissions or attempt to interfere with the site or its services.</p><h2>8. Changes</h2><p>These terms may be updated as site features, platform arrangements or legal requirements change.</p><div class="trust-nav"><a href="about.html">About Us</a><a href="privacy.html">Privacy Policy</a><a href="risk-disclaimer.html">Risk Disclaimer</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`},
ms:{brand:'Max Rebate',back:'Kembali',title:'Terma Penggunaan',intro:'Dengan menggunakan laman ini, anda menerima terma asas ini.',html:`<h2>Tujuan</h2><p>Max Rebate menyediakan maklumat umum dan sokongan permohonan berkaitan rebat, pembukaan akaun, kos dagangan dan kerjasama Introducing Broker. Ia bukan nasihat kewangan peribadi.</p><h2>Permohonan</h2><p>Penghantaran permohonan tidak menjamin kelulusan, jumlah rebat atau masa bayaran. Peraturan akhir platform berkaitan terpakai.</p><h2>Risiko</h2><p>Rebat tidak mengurangkan risiko pasaran dan tidak menjamin keuntungan.</p><div class="trust-nav"><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="risk-disclaimer.html">Risk</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`},
'th':{brand:'Max Rebate',back:'กลับเว็บไซต์',title:'ข้อกำหนดการใช้งาน',intro:'การใช้เว็บไซต์นี้หมายถึงคุณยอมรับข้อกำหนดพื้นฐานเหล่านี้',html:`<h2>วัตถุประสงค์</h2><p>Max Rebate ให้ข้อมูลทั่วไปและการสนับสนุนการสมัครเกี่ยวกับรีเบต การเปิดบัญชี ต้นทุนการเทรด และ Introducing Broker โดยไม่ใช่คำแนะนำทางการเงินส่วนบุคคล</p><h2>การสมัคร</h2><p>การส่งใบสมัครไม่รับประกันการอนุมัติ จำนวนรีเบต หรือเวลาชำระ กฎสุดท้ายของแพลตฟอร์มที่เกี่ยวข้องมีผลบังคับใช้</p><h2>ความเสี่ยง</h2><p>รีเบตไม่ลดความเสี่ยงของตลาดและไม่รับประกันกำไร</p><div class="trust-nav"><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="risk-disclaimer.html">Risk</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`}}
