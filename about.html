const D={
'zh-CN':{brand:'满返网',back:'返回网站',title:'关于我们',intro:'少一层中间成本，多一点透明。',html:`<h2>我们是谁</h2><p>满返网（Max Rebate）是一个独立的交易返佣、交易成本与经纪商合作信息服务平台。我们希望把返佣结构、账户类型、申请流程和实际交易成本用更清晰、可核对的方式呈现给用户。</p><div class="callout"><strong>我们的原则：</strong>少一层中间成本，多一点透明。</div><h2>我们在做什么</h2><p>目前网站提供TMGM相关的返佣申请、满返说明、开户链接、账户类型和Introducing Broker合作信息。未来可逐步覆盖更多经纪商和交易平台，但每个平台的资格、金额、结算和审核规则都可能不同。</p><h2>我们如何工作</h2><ul><li>尽量公开返佣结构、账户类型和申请步骤。</li><li>只收集处理申请所合理需要的信息。</li><li>不会要求交易密码、验证码、银行卡密码或证件图片。</li><li>返佣资格和最终金额以对应平台的实际审核及规则为准。</li></ul><h2>独立身份</h2><p>满返网是独立的返佣及合作信息服务平台，并非TMGM或其他交易平台的官方网站，也不代表任何平台提供金融建议。平台名称和标识仅用于识别对应产品或服务。</p><h2>我们的目标</h2><p>我们希望用户在开户或申请返佣前，能够更清楚地知道自己使用的账户类型、可能承担的交易成本，以及返佣如何影响实际成本，而不是只看到一个开户链接。</p><div class="trust-nav"><a href="privacy.html">隐私政策</a><a href="terms.html">使用条款</a><a href="risk-disclaimer.html">风险声明</a><a href="contact.html">联系我们</a></div><p class="meta">Last updated: 10 August 2026</p>`},
'zh-TW':{brand:'滿返網',back:'返回網站',title:'關於我們',intro:'少一層中間成本，多一點透明。',html:`<h2>我們是誰</h2><p>滿返網（Max Rebate）是一個獨立的交易返佣、交易成本與經紀商合作資訊服務平台。我們希望把返佣結構、帳戶類型、申請流程和實際交易成本以更清晰、可核對的方式呈現。</p><div class="callout"><strong>我們的原則：</strong>少一層中間成本，多一點透明。</div><h2>我們在做甚麼</h2><p>目前網站提供TMGM相關返佣申請、滿返說明、開戶連結、帳戶類型和Introducing Broker合作資訊。未來可逐步覆蓋更多平台。</p><h2>獨立身份</h2><p>滿返網並非TMGM或其他交易平台的官方網站，也不代表任何平台提供金融建議。最終資格、金額與結算以對應平台審核及規則為準。</p><div class="trust-nav"><a href="privacy.html">私隱政策</a><a href="terms.html">使用條款</a><a href="risk-disclaimer.html">風險聲明</a><a href="contact.html">聯絡我們</a></div><p class="meta">Last updated: 10 August 2026</p>`},
en:{brand:'Max Rebate',back:'Back to website',title:'About Us',intro:'Less hidden cost. More transparency.',html:`<h2>Who we are</h2><p>Max Rebate is an independent trading rebate, trading-cost and broker partnership information service. Our aim is to present rebate structures, account types, application processes and actual trading costs in a clearer and more verifiable way.</p><div class="callout"><strong>Our principle:</strong> less hidden cost, more transparency.</div><h2>What we do</h2><p>The site currently provides information and application support relating to TMGM rebates, account opening, account types and Introducing Broker partnerships. Additional platforms may be added over time.</p><h2>How we work</h2><ul><li>Explain rebate structures and application steps as clearly as possible.</li><li>Collect only information reasonably needed to process an application.</li><li>Never request trading passwords, verification codes, bank-card passwords or identity-document images.</li><li>Eligibility and final rebate amounts remain subject to the relevant platform's rules and review.</li></ul><h2>Independent status</h2><p>Max Rebate is not the official website of TMGM or any other trading platform and does not provide financial advice on behalf of any platform. Platform names and marks are used only to identify the relevant products or services.</p><div class="trust-nav"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a><a href="risk-disclaimer.html">Risk Disclaimer</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`},
ms:{brand:'Max Rebate',back:'Kembali',title:'Tentang Kami',intro:'Kos lebih telus. Struktur rebat lebih jelas.',html:`<h2>Siapa kami</h2><p>Max Rebate ialah perkhidmatan bebas untuk maklumat rebat dagangan, kos dagangan dan kerjasama broker. Kami menerangkan struktur rebat, jenis akaun dan proses permohonan dengan lebih jelas.</p><h2>Status bebas</h2><p>Kami bukan laman rasmi TMGM atau mana-mana platform dagangan dan tidak memberikan nasihat kewangan bagi pihak platform. Kelayakan dan jumlah akhir tertakluk pada semakan dan peraturan platform berkaitan.</p><div class="trust-nav"><a href="privacy.html">Privasi</a><a href="terms.html">Terma</a><a href="risk-disclaimer.html">Risiko</a><a href="contact.html">Hubungi</a></div><p class="meta">Last updated: 10 August 2026</p>`},
th':{brand:'Max Rebate',back:'กลับเว็บไซต์',title:'เกี่ยวกับเรา',intro:'ต้นทุนชัดเจนขึ้น โครงสร้างรีเบตโปร่งใสมากขึ้น',html:`<h2>เราเป็นใคร</h2><p>Max Rebate เป็นบริการอิสระด้านข้อมูลรีเบต ต้นทุนการเทรด และความร่วมมือกับโบรกเกอร์ เรามุ่งอธิบายโครงสร้างรีเบต ประเภทบัญชี และขั้นตอนการสมัครให้ชัดเจนขึ้น</p><h2>สถานะอิสระ</h2><p>เราไม่ใช่เว็บไซต์ทางการของ TMGM หรือแพลตฟอร์มอื่น และไม่ได้ให้คำแนะนำทางการเงินในนามของแพลตฟอร์ม คุณสมบัติและจำนวนรีเบตสุดท้ายขึ้นอยู่กับกฎและการตรวจสอบของแพลตฟอร์มที่เกี่ยวข้อง</p><div class="trust-nav"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="risk-disclaimer.html">Risk</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`}}
function setLang(l){if(!D[l])l='en';localStorage.setItem('tmgm-lang',l);document.documentElement.lang=l;document.getElementById('lang').value=l;const d=D[l];document.getElementById('brand').textContent=d.brand;document.getElementById('back').textContent=d.back;document.getElementById('title').textContent=d.title;document.getElementById('intro').textContent=d.intro;document.getElementById('body').innerHTML=d.html}document.getElementById('lang').addEventListener('change',e=>setLang(e.target.value));const s=localStorage.getItem('tmgm-lang'),b=(navigator.language||'en').toLowerCase();setLang(s||(b.startsWith('zh-tw')||b.startsWith('zh-hk')?'zh-TW':b.startsWith('zh')?'zh-CN':b.startsWith('ms')?'ms':b.startsWith('th')?'th':'en'));
