en:{brand:'Max Rebate',back:'Back to website',title:'Contact',intro:'Contact us about rebate applications, existing accounts, IB partnerships or privacy requests.',html:`<h2>Contact channels</h2>${channels}<h2>What to include</h2><p>For an application enquiry, please provide the application reference (for example REBATE-... or IB-...) and the platform-registered email so the record can be identified efficiently.</p><div class="callout warning"><strong>Do not send:</strong> trading or investor passwords, verification codes, bank-card passwords, identity-document images or unnecessary sensitive information.</div><h2>Privacy requests</h2><p>To request access, correction or deletion of information you previously submitted, contact us through one of the channels above and state “Privacy Request”. We may need enough information to match you to the relevant application record.</p><h2>Platform matters</h2><p>For account security, deposits or withdrawals, identity verification, platform outages or official product terms, use the relevant trading platform's official support and documents.</p><div class="trust-nav"><a href="about.html">About Us</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a><a href="risk-disclaimer.html">Risk Disclaimer</a></div><p class="meta">Last updated: 10 August 2026</p>`},
