'zh-CN':{brand:'满返网',back:'返回网站',title:'风险声明',intro:'返佣能改变部分交易成本，但不会改变交易本身的市场风险。',html:`<div class="callout warning"><strong>重要：</strong>差价合约（CFD）、外汇及其他杠杆交易产品具有高风险，价格的小幅变化可能造成相对较大的盈利或亏损。你可能迅速损失投入资金。</div><h2>不构成个人投资建议</h2><p>本网站内容用于一般信息、交易成本说明、返佣信息和申请支持。我们不会根据你的个人财务状况、投资目标或风险承受能力向你提供个人金融建议或交易建议。</p><h2>返佣不等于降低市场风险</h2><p>返佣可能返还部分符合条件的佣金或交易成本，但不会减少价格波动、杠杆、滑点、流动性、强制平仓、隔夜费用或其他交易风险。不要因为存在返佣而增加不适合自己的交易量。</p><h2>历史记录不是未来保证</h2><p>网站展示的历史返佣记录、Top IB数据、成本示例、计算结果或案例，仅用于说明过去记录或计算方式，不保证未来返佣、交易表现或收益。</p><h2>平台规则可能变化</h2><p>点差、手续费、返佣比例、产品、账户组别、地区资格和结算方式可能变化。最终产品条款、风险披露、资格和审核结果以对应平台官方信息为准。</p><h2>独立决定</h2><p>在开立或使用任何交易账户前，你应自行了解产品和风险，并在需要时寻求具备相应资质的独立专业意见。</p><div class="trust-nav"><a href="about.html">关于我们</a><a href="privacy.html">隐私政策</a><a href="terms.html">使用条款</a><a href="contact.html">联系我们</a></div><p class="meta">Last updated: 10 August 2026</p>`},

en:{brand:'Max Rebate',back:'Back to website',title:'Risk Disclaimer',intro:'A rebate may change part of your trading cost. It does not change the market risk of trading.',html:`<div class="callout warning"><strong>Important:</strong> CFDs, foreign exchange and other leveraged trading products are high risk. Relatively small price movements can produce comparatively large gains or losses and you may lose funds rapidly.</div><h2>Not personal financial advice</h2><p>This site provides general information, trading-cost explanations, rebate information and application support. It does not provide personal financial or trading advice based on your financial position, objectives or risk tolerance.</p><h2>Rebates do not reduce market risk</h2><p>A rebate may return part of eligible commissions or trading costs, but it does not reduce price risk, leverage risk, slippage, liquidity risk, margin-closeout risk, overnight charges or other trading risks. Do not increase trading volume merely because a rebate is available.</p><h2>Past records are not a guarantee</h2><p>Historical rebate records, Top IB figures, examples and calculations illustrate past records or calculation methods only. They do not guarantee future rebates, trading performance or returns.</p><h2>Platform rules can change</h2><p>Spreads, fees, rebate rates, products, account groups, regional eligibility and settlement arrangements may change. The relevant platform's official product terms, risk disclosures and final review prevail.</p><h2>Make your own assessment</h2><p>Before opening or using a trading account, understand the products and risks and seek appropriately qualified independent advice if you need it.</p><div class="trust-nav"><a href="about.html">About Us</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a><a href="contact.html">Contact</a></div><p class="meta">Last updated: 10 August 2026</p>`},
